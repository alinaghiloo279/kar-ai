<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071d18">
  <title>ایرو مپ | نقشه هوشمند آذربایجان غربی</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#071d18;--panel:rgba(9,35,28,.91);--line:rgba(180,220,198,.15);--muted:#a8c1b4;--lime:#a3e635;--gold:#d9b86c}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Vazirmatn,sans-serif;color:#f3f8f4}
    #map{position:absolute;inset:0;background:#102c25}
    .topbar{position:absolute;z-index:5;top:16px;right:16px;left:16px;display:flex;align-items:center;gap:12px;pointer-events:none}
    .brand,.search,.icon-btn,.layers,.status{pointer-events:auto;backdrop-filter:blur(18px);background:var(--panel);border:1px solid var(--line);box-shadow:0 12px 36px #0005}
    .brand{display:flex;align-items:center;gap:11px;padding:9px 15px;border-radius:17px;min-width:190px}
    .brand-mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#b8f45d,#5d9d30);color:#10251a;font-weight:900;font-size:18px;box-shadow:inset 0 1px #fff8,0 5px 18px #a3e63530}
    .brand-name{font-size:16px;font-weight:900;letter-spacing:.2px}.brand-sub{font-size:10px;color:var(--muted);margin-top:-2px}
    .search{height:56px;flex:1;max-width:560px;border-radius:17px;display:flex;align-items:center;padding:0 16px;gap:10px}
    .search input{font:500 13px Vazirmatn,sans-serif;color:#fff;background:none;border:0;outline:0;width:100%}.search input::placeholder{color:#a8bdb2}
    .icon-btn{width:48px;height:48px;border-radius:15px;color:#eff9f1;font-size:19px;cursor:pointer}
    .right-tools{position:absolute;z-index:5;right:16px;top:91px;display:grid;gap:9px}
    .left-tools{position:absolute;z-index:5;left:16px;top:91px;display:grid;gap:9px}
    .tool{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(16px);color:#f4fff6;cursor:pointer;font-size:17px;box-shadow:0 8px 24px #0004}
    .tool.active{color:#152417;background:var(--lime);border-color:transparent}
    .bottom-panel{position:absolute;z-index:5;right:16px;bottom:18px;width:min(380px,calc(100vw - 32px));padding:16px;border:1px solid var(--line);border-radius:20px;background:var(--panel);backdrop-filter:blur(18px);box-shadow:0 16px 45px #0006}
    .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.panel-title{font-weight:800;font-size:14px}.province{font-size:10px;color:var(--lime);border:1px solid #a3e63555;padding:4px 9px;border-radius:20px}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#ffffff09;border:1px solid #ffffff10;border-radius:13px;padding:10px}.stat strong{display:block;font-size:17px;color:var(--lime);font-weight:800}.stat span{font-size:10px;color:var(--muted)}
    .status{position:absolute;z-index:5;left:16px;bottom:18px;max-width:min(360px,calc(100vw - 32px));padding:11px 14px;border-radius:14px;font-size:11px;color:#e8f3eb;line-height:1.8}
    .status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#e5b85b;margin-left:7px;box-shadow:0 0 10px #e5b85b88}
    .status.ok .status-dot{background:#a3e635;box-shadow:0 0 10px #a3e63588}
    .attribution{position:absolute;z-index:4;bottom:5px;left:7px;font:10px Arial,sans-serif;color:#dbe8df;background:#061710aa;padding:3px 6px;border-radius:5px;direction:ltr}
    .attribution a{color:#dbe8df}
    .maplibregl-ctrl-group{background:#09231c!important;border:1px solid var(--line)!important;border-radius:12px!important;overflow:hidden}.maplibregl-ctrl button{filter:invert(1)}
    .maplibregl-ctrl-bottom-right{bottom:6px;right:8px}
    .toast{position:absolute;z-index:10;top:85px;left:50%;transform:translateX(-50%);background:#381f17;border:1px solid #d9a45b66;color:#ffe7c4;padding:10px 15px;border-radius:12px;font-size:12px;display:none}
    @media(max-width:680px){.topbar{top:10px;right:10px;left:10px;gap:7px;flex-wrap:wrap}.brand{min-width:0;padding:7px 10px}.brand-mark{width:34px;height:34px}.brand-name{font-size:14px}.brand-sub{font-size:9px}.search{order:3;flex-basis:100%;max-width:none;height:46px}.icon-btn{width:43px;height:43px}.right-tools{right:10px;top:120px}.left-tools{left:10px;top:120px}.bottom-panel{right:10px;bottom:12px;width:calc(100vw - 20px);padding:13px}.status{left:10px;bottom:154px;font-size:10px}.attribution{display:none}}
  </style>
</head>
<body>
  <div id="map" aria-label="نقشه ایرو مپ"></div>
  <header class="topbar">
    <div class="brand"><div class="brand-mark">A</div><div><div class="brand-name">AIRO MAP</div><div class="brand-sub">نقشه هوشمند ایران</div></div></div>
    <label class="search"><span>⌕</span><input id="searchInput" type="search" placeholder="جست‌وجوی شهر، روستا یا مکان..." autocomplete="off"><span style="font-size:10px;color:#a8c1b4">آذربایجان غربی</span></label>
    <button class="icon-btn" id="locateBtn" title="موقعیت من" aria-label="موقعیت من">⌖</button>
  </header>
  <div class="right-tools">
    <button class="tool active" id="roadsToggle" title="راه‌ها">⌁</button>
    <button class="tool active" id="placesToggle" title="مکان‌ها">⌖</button>
    <button class="tool" id="buildingsToggle" title="ساختمان‌ها">▦</button>
  </div>
  <div class="left-tools">
    <button class="tool" id="zoomIn" title="بزرگ‌نمایی">＋</button>
    <button class="tool" id="zoomOut" title="کوچک‌نمایی">−</button>
    <button class="tool" id="resetView" title="نمای استان">⌂</button>
  </div>
  <section class="bottom-panel">
    <div class="panel-head"><div class="panel-title">آذربایجان غربی</div><span class="province">نسخه آزمایشی منطقه‌ای</span></div>
    <div class="stats">
      <div class="stat"><strong>۱۷</strong><span>شهرستان</span></div>
      <div class="stat"><strong>۴۴°–۴۷°</strong><span>محدوده طول جغرافیایی</span></div>
      <div class="stat"><strong>OSM</strong><span>داده پایه نقشه</span></div>
    </div>
  </section>
  <div class="status" id="status"><span class="status-dot"></span><span id="statusText">در انتظار اتصال به سرویس کاشی‌های اختصاصی ایرو…</span></div>
  <div class="attribution">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</div>
  <div class="toast" id="toast"></div>
<script>
(() => {
  // آدرس سرویس کاشی پس از تکمیل reverse proxy سرور تنظیم می‌شود.
  const TILE_BASE = 'https://tiles.airo.cam';
  const provinceBounds = [[44.00,35.94],[47.56,39.82]];
  const status = document.getElementById('status');
  const statusText = document.getElementById('statusText');
  const toast = (message) => { const el=document.getElementById('toast'); el.textContent=message; el.style.display='block'; setTimeout(()=>el.style.display='none',3200); };

  if (!window.maplibregl) {
    statusText.textContent='کتابخانه نقشه بارگذاری نشد؛ اتصال اینترنت و CDN را بررسی کنید.';
    return;
  }

  const map = new maplibregl.Map({
    container:'map',
    center:[45.0,38.35],
    zoom:7.4,
    minZoom:5,
    maxZoom:18,
    maxBounds:[[42.8,34.7],[48.8,41.1]],
    attributionControl:false,
    style:{
      version:8,
      glyphs:'https://fonts.openmaptiles.org/{fontstack}/{range}.pbf',
      sources:{
        airo_lines:{type:'vector',tiles:[TILE_BASE+'/osm_lines/{z}/{x}/{y}'],minzoom:5,maxzoom:16,scheme:'xyz'},
        airo_polygons:{type:'vector',tiles:[TILE_BASE+'/osm_multipolygons/{z}/{x}/{y}'],minzoom:5,maxzoom:16,scheme:'xyz'},
        airo_points:{type:'vector',tiles:[TILE_BASE+'/osm_points/{z}/{x}/{y}'],minzoom:5,maxzoom:16,scheme:'xyz'}
      },
      layers:[
        {id:'background',type:'background',paint:{'background-color':'#102c25'}},
        {id:'landuse',type:'fill',source:'airo_polygons','source-layer':'osm_multipolygons',filter:['has','landuse'],paint:{'fill-color':['match',['get','landuse'],['forest','wood'],'#244c39',['farmland','orchard'],'#354b2d',['residential'],'#203b34','#29483a'],'fill-opacity':0.72}},
        {id:'water-polygons',type:'fill',source:'airo_polygons','source-layer':'osm_multipolygons',filter:['any',['has','water'],['==',['get','natural'],'water']],paint:{'fill-color':'#24576a','fill-opacity':0.92}},
        {id:'buildings',type:'fill',source:'airo_polygons','source-layer':'osm_multipolygons',filter:['has','building'],minzoom:13,paint:{'fill-color':'#9ba99a','fill-opacity':0.62,'fill-outline-color':'#c4d0bd'}},
        {id:'minor-roads-casing',type:'line',source:'airo_lines','source-layer':'osm_lines',filter:['has','highway'],minzoom:9,paint:{'line-color':'#10251e','line-width':['interpolate',['linear'],['zoom'],9,1,16,5],'line-opacity':0.9}},
        {id:'minor-roads',type:'line',source:'airo_lines','source-layer':'osm_lines',filter:['has','highway'],minzoom:9,paint:{'line-color':['match',['get','highway'],['motorway','trunk','primary'],'#d6b66d',['secondary','tertiary'],'#c1c9b9','#879c8e'],'line-width':['interpolate',['linear'],['zoom'],9,0.55,16,2.7],'line-opacity':0.95}},
        {id:'major-roads-casing',type:'line',source:'airo_lines','source-layer':'osm_lines',filter:['in',['get','highway'],['literal',['motorway','trunk','primary','secondary']]],paint:{'line-color':'#18271f','line-width':['interpolate',['linear'],['zoom'],5,1.2,12,4.5,16,8]}},
        {id:'major-roads',type:'line',source:'airo_lines','source-layer':'osm_lines',filter:['in',['get','highway'],['literal',['motorway','trunk','primary','secondary']]],paint:{'line-color':['match',['get','highway'],['motorway','trunk'],'#e6c77e',['primary'],'#d8bd82','#c3c9b5'],'line-width':['interpolate',['linear'],['zoom'],5,0.55,12,2.6,16,5.2]}},
        {id:'road-labels',type:'symbol',source:'airo_lines','source-layer':'osm_lines',filter:['all',['has','name'],['has','highway']],minzoom:12,layout:{'text-field':['get','name'],'text-font':['Noto Sans Regular'],'text-size':10,'symbol-placement':'line','text-rotation-alignment':'map'},paint:{'text-color':'#e6eee5','text-halo-color':'#183027','text-halo-width':1.2}},
        {id:'poi-dots',type:'circle',source:'airo_points','source-layer':'osm_points',filter:['any',['has','amenity'],['has','shop'],['has','tourism']],minzoom:13,paint:{'circle-radius':['interpolate',['linear'],['zoom'],13,2,17,5],'circle-color':'#b9e66b','circle-stroke-color':'#10271d','circle-stroke-width':1}},
        {id:'place-labels',type:'symbol',source:'airo_points','source-layer':'osm_points',filter:['has','name'],minzoom:8,layout:{'text-field':['get','name'],'text-font':['Noto Sans Regular'],'text-size':['interpolate',['linear'],['zoom'],8,10,14,14],'text-offset':[0,1.1],'text-anchor':'top','text-allow-overlap':false},paint:{'text-color':'#f2f5e9','text-halo-color':'#142b22','text-halo-width':1.5}}
      ]
    }
  });

  map.addControl(new maplibregl.NavigationControl({showCompass:true,visualizePitch:false}),'bottom-right');
  map.on('load',()=>{
    status.classList.add('ok');
    statusText.textContent='نقشه آماده است؛ در صورت عدم نمایش جزئیات، سرویس کاشی سرور هنوز به دامنه متصل نشده است.';
    map.fitBounds(provinceBounds,{padding:{top:100,bottom:190,left:70,right:70},duration:0});
  });
  map.on('error',(e)=>{
    const msg=(e.error&&e.error.message)||'خطای دریافت داده نقشه';
    if(/fetch|network|load|403|404|Failed/i.test(msg)){
      status.classList.remove('ok');
      statusText.textContent='ارتباط با سرور کاشی ایرو برقرار نشد؛ مسیر tiles.kar-ai.ir باید به Martin متصل شود.';
    }
  });

  document.getElementById('zoomIn').onclick=()=>map.zoomIn();
  document.getElementById('zoomOut').onclick=()=>map.zoomOut();
  document.getElementById('resetView').onclick=()=>map.fitBounds(provinceBounds,{padding:{top:100,bottom:190,left:70,right:70}});
  document.getElementById('locateBtn').onclick=()=>{
    if(!navigator.geolocation){toast('موقعیت‌یابی در این مرورگر پشتیبانی نمی‌شود.');return;}
    navigator.geolocation.getCurrentPosition(p=>map.flyTo({center:[p.coords.longitude,p.coords.latitude],zoom:14}),()=>toast('دسترسی موقعیت مکانی داده نشد.'),{enableHighAccuracy:true,timeout:10000});
  };
  const toggle=(button,ids)=>button.onclick=()=>{
    const visible=button.classList.toggle('active');
    ids.forEach(id=>{if(map.getLayer(id))map.setLayoutProperty(id,'visibility',visible?'visible':'none');});
  };
  toggle(document.getElementById('roadsToggle'),['minor-roads','minor-roads-casing','major-roads','major-roads-casing','road-labels']);
  toggle(document.getElementById('placesToggle'),['poi-dots','place-labels']);
  toggle(document.getElementById('buildingsToggle'),['buildings']);
  document.getElementById('searchInput').addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.value.trim())toast('جست‌وجوی نام مکان پس از اتصال سرویس جست‌وجوی ایرو فعال می‌شود.');
  });
})();
</script>
</body>
</html>
