<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>KAR AI | هوش مصنوعی لوکس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #050505;
  --bg-elev: #0E0E10;
  --bg-card: rgba(20, 20, 22, 0.72);
  --bg-card-hover: rgba(28, 28, 32, 0.85);

  /* Gold gradient system */
  --gold-1: #F5E6B8;
  --gold-2: #F5D76E;
  --gold-3: #C9A227;
  --gold-4: #8B6914;
  --gold-deep: #5C4600;

  /* Silver */
  --silver-1: #F0F0F0;
  --silver-2: #B8B8B8;
  --silver-3: #808080;

  /* Text */
  --text-main: #F2F2F2;
  --text-gold: #E8D9A0;
  --text-muted: #7A7A7A;
  --text-dim: #4A4A4A;

  /* Borders & lines */
  --border-gold: rgba(201, 162, 39, 0.35);
  --border-gold-bright: rgba(245, 215, 110, 0.6);
  --border-subtle: rgba(255, 255, 255, 0.06);

  /* Glows */
  --glow-gold: 0 0 40px rgba(201, 162, 39, 0.25);
  --glow-gold-soft: 0 0 20px rgba(201, 162, 39, 0.15);
  --glow-gold-strong: 0 0 60px rgba(245, 215, 110, 0.4);

  --radius: 22px;
  --radius-lg: 28px;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', system-ui, sans-serif; }

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  background: var(--bg-deep);
  color: var(--text-main);
  display: flex;
  flex-direction: column;
  position: relative;
  letter-spacing: 0.01em;
  -webkit-font-smoothing: antialiased;
}

/* Background luxury glows */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 15% 5%, rgba(201, 162, 39, 0.08) 0%, transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(245, 215, 110, 0.05) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(139, 105, 20, 0.03) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* Subtle noise texture */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
  opacity: 0.4;
}

button { cursor: pointer; border: none; outline: none; background: transparent; font-family: inherit; }

/* ========== HEADER ========== */
header {
  position: relative;
  z-index: 10;
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-subtle);
  backdrop-filter: blur(20px);
  background: rgba(5, 5, 5, 0.6);
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 900;
  font-size: 15px;
  letter-spacing: 0.15em;
  color: var(--gold-2);
  text-transform: uppercase;
}

.logo-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--gold-1) 0%, var(--gold-3) 60%, var(--gold-4) 100%);
  color: #050505;
  display: grid;
  place-items: center;
  font-size: 18px;
  font-weight: 900;
  box-shadow: var(--glow-gold-soft), inset 0 1px 0 rgba(255,255,255,0.4);
  position: relative;
}

.logo-icon::after {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 50%;
  border: 1px solid var(--border-gold);
}

.header-actions {
  display: flex;
  gap: 10px;
  align-items: center;
}

.icon-circle {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: rgba(20, 20, 22, 0.8);
  border: 1px solid var(--border-subtle);
  color: var(--text-gold);
  font-size: 16px;
  transition: all 0.3s;
}

.icon-circle:hover {
  border-color: var(--border-gold);
  box-shadow: var(--glow-gold-soft);
  background: rgba(30, 30, 32, 0.9);
}

/* ========== AI SECTION ========== */
.ai-section {
  position: relative;
  z-index: 5;
  padding: 24px 20px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  flex-shrink: 0;
}

/* Premium Robot */
.robot-container {
  position: relative;
  width: 84px;
  height: 84px;
  margin-bottom: 16px;
  animation: float 4s ease-in-out infinite;
}

.robot {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  position: relative;
  background:
    radial-gradient(circle at 35% 30%, #FFF4CC 0%, var(--gold-2) 25%, var(--gold-3) 55%, var(--gold-4) 85%, var(--gold-deep) 100%);
  box-shadow:
    var(--glow-gold-strong),
    inset 0 -8px 16px rgba(0,0,0,0.4),
    inset 0 8px 16px rgba(255,255,255,0.3);
  display: flex;
  justify-content: center;
  align-items: center;
  border: 1px solid rgba(255, 240, 180, 0.6);
}

.robot::before,
.robot::after {
  content: '';
  width: 12px;
  height: 12px;
  background: #0A0A0A;
  border-radius: 50%;
  position: absolute;
  top: 42%;
  animation: blink 5s infinite;
  box-shadow: 0 0 6px rgba(0,0,0,0.8), inset 0 1px 2px rgba(255,255,255,0.5);
}

.robot::before { right: 26%; }
.robot::after { left: 26%; }

/* Orbital rings */
.robot-container::before,
.robot-container::after {
  content: '';
  position: absolute;
  border: 1px solid rgba(201, 162, 39, 0.2);
  border-radius: 50%;
  animation: orbit 8s linear infinite;
}

.robot-container::before {
  inset: -14px;
  border-top-color: var(--gold-3);
  border-right-color: transparent;
}

.robot-container::after {
  inset: -24px;
  border-bottom-color: var(--gold-2);
  border-left-color: transparent;
  animation-duration: 12s;
  animation-direction: reverse;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

@keyframes blink {
  0%, 94%, 100% { transform: scaleY(1); }
  96% { transform: scaleY(0.1); }
}

@keyframes orbit {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* ========== LANGUAGE SELECTOR ========== */
.lang-selector {
  display: flex;
  gap: 8px;
  margin-bottom: 18px;
  flex-wrap: wrap;
  justify-content: center;
}

.lang-btn {
  padding: 8px 16px;
  border-radius: 50px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: var(--text-gold);
  background: rgba(15, 15, 15, 0.6);
  border: 1px solid rgba(201, 162, 39, 0.2);
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.lang-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(245, 215, 110, 0.15), transparent);
  transform: translateX(-100%);
  transition: transform 0.6s;
}

.lang-btn:hover::before {
  transform: translateX(100%);
}

.lang-btn:hover {
  border-color: var(--border-gold);
  background: rgba(25, 25, 25, 0.9);
  box-shadow: var(--glow-gold-soft);
}

.lang-btn.active {
  background: linear-gradient(135deg, var(--gold-1), var(--gold-3) 60%, var(--gold-4));
  color: #0A0A0A;
  border-color: var(--gold-2);
  font-weight: 800;
  box-shadow: var(--glow-gold), inset 0 1px 0 rgba(255,255,255,0.4);
}

/* ========== CHAT CONTAINER ========== */
.chat-container {
  width: 100%;
  max-width: 620px;
  height: 240px;
  position: relative;
  border-radius: var(--radius);
  background: linear-gradient(180deg, rgba(15, 15, 17, 0.9), rgba(10, 10, 12, 0.95));
  border: 1px solid var(--border-gold);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow:
    var(--glow-gold-soft),
    inset 0 1px 0 rgba(255, 255, 255, 0.05);
}

.chat-container::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold-3), transparent);
  opacity: 0.6;
}

.chat-messages {
  flex: 1;
  padding: 14px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  scrollbar-width: thin;
  scrollbar-color: var(--border-gold) transparent;
}

.chat-messages::-webkit-scrollbar {
  width: 4px;
}

.chat-messages::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, var(--gold-2), var(--gold-4));
  border-radius: 2px;
}

/* Messages */
.msg {
  max-width: 85%;
  padding: 11px 16px;
  border-radius: 16px;
  font-size: 13px;
  line-height: 1.7;
  animation: msgIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  opacity: 0;
  transform: translateY(8px);
  word-wrap: break-word;
}

@keyframes msgIn {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.msg.bot {
  align-self: flex-start;
  background: rgba(20, 20, 24, 0.9);
  border: 1px solid rgba(201, 162, 39, 0.2);
  border-bottom-right-radius: 4px;
  color: var(--text-main);
  position: relative;
}

.msg.bot::before {
  content: '◈';
  position: absolute;
  right: -22px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--gold-3);
  font-size: 10px;
  opacity: 0.7;
}

.msg.user {
  align-self: flex-end;
  background: linear-gradient(135deg, var(--gold-2), var(--gold-3) 70%, var(--gold-4));
  color: #0A0A0A;
  border-bottom-left-radius: 4px;
  font-weight: 700;
  box-shadow: 0 4px 12px rgba(201, 162, 39, 0.25);
}

/* Chat input */
.chat-input {
  display: flex;
  padding: 10px;
  background: rgba(8, 8, 10, 0.9);
  border-top: 1px solid var(--border-subtle);
  align-items: center;
  gap: 8px;
}

.chat-input input {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text-main);
  padding: 10px 12px;
  font-size: 13px;
  outline: none;
  font-family: inherit;
  letter-spacing: 0.01em;
}

.chat-input input::placeholder {
  color: var(--text-dim);
}

.btn-icon {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 16px;
  transition: all 0.3s;
  flex-shrink: 0;
}

.btn-mic {
  background: rgba(20, 20, 22, 0.9);
  color: var(--text-gold);
  border: 1px solid var(--border-subtle);
}

.btn-mic:hover {
  border-color: var(--border-gold);
  box-shadow: var(--glow-gold-soft);
}

.btn-mic.recording {
  background: linear-gradient(135deg, #FF5252, #B71C1C);
  color: white;
  border-color: #FF5252;
  animation: recordPulse 1.5s infinite;
}

@keyframes recordPulse {
  0%, 100% {
    box-shadow: 0 0 0 0 rgba(255, 82, 82, 0.5);
  }
  50% {
    box-shadow: 0 0 0 12px rgba(255, 82, 82, 0);
  }
}

.btn-send {
  background: linear-gradient(135deg, var(--gold-1), var(--gold-3) 60%, var(--gold-4));
  color: #0A0A0A;
  box-shadow: var(--glow-gold-soft), inset 0 1px 0 rgba(255,255,255,0.3);
  font-weight: 900;
}

.btn-send:hover {
  box-shadow: var(--glow-gold), inset 0 1px 0 rgba(255,255,255,0.4);
  transform: scale(1.05);
}

.btn-send:active {
  transform: scale(0.95);
}

/* ========== BRANCHES SECTION ========== */
.branches-section {
  position: relative;
  z-index: 5;
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  border-top: 1px solid var(--border-subtle);
  background: linear-gradient(180deg, transparent, rgba(5, 5, 5, 0.4));
}

.branches-section::before {
  content: 'خدمات تخصصی';
  display: block;
  font-size: 11px;
  letter-spacing: 0.3em;
  color: var(--text-muted);
  text-align: center;
  margin-bottom: 16px;
  font-weight: 500;
  position: relative;
}

.branches-section::after {
  content: '';
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: 60px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold-3), transparent);
}

.branches-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  max-width: 620px;
  margin: 0 auto;
  padding-bottom: 20px;
}

@media (max-width: 600px) {
  .branches-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
}

.branch-card {
  position: relative;
  background: var(--bg-card);
  border-radius: 20px;
  padding: 14px 8px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--border-subtle);
  transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  cursor: pointer;
  overflow: hidden;
  backdrop-filter: blur(10px);
}

.branch-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 0%, rgba(201, 162, 39, 0.1), transparent 60%);
  opacity: 0;
  transition: opacity 0.35s;
}

.branch-card:hover {
  transform: translateY(-4px);
  border-color: var(--border-gold);
  box-shadow: var(--glow-gold-soft);
}

.branch-card:hover::before {
  opacity: 1;
}

.branch-card:active {
  transform: scale(0.96);
}

.branch-icon-wrap {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at 30% 20%, rgba(245, 215, 110, 0.15), rgba(201, 162, 39, 0.05) 70%, transparent);
  border: 1px solid rgba(201, 162, 39, 0.25);
  position: relative;
  transition: all 0.35s;
}

.branch-card:hover .branch-icon-wrap {
  border-color: var(--border-gold-bright);
  box-shadow: var(--glow-gold-soft);
}

.branch-icon {
  font-size: 24px;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
  transition: transform 0.35s;
}

.branch-card:hover .branch-icon {
  transform: scale(1.15);
}

.branch-name {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--text-gold);
  text-align: center;
  position: relative;
  z-index: 1;
  transition: color 0.3s;
}

.branch-card:hover .branch-name {
  color: var(--gold-1);
}

/* ========== FORM MODAL ========== */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(8px);
  display: none;
  align-items: flex-end;
  justify-content: center;
  z-index: 100;
}

.modal-backdrop.show {
  display: flex;
}

.modal {
  background: linear-gradient(180deg, #14141A, #0A0A0E);
  width: 100%;
  max-width: 620px;
  border-radius: 28px 28px 0 0;
  padding: 24px;
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  border-top: 1px solid var(--border-gold);
  box-shadow: 0 -20px 60px rgba(201, 162, 39, 0.15);
  position: relative;
}

.modal::before {
  content: '';
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 40px;
  height: 3px;
  border-radius: 2px;
  background: linear-gradient(90deg, transparent, var(--gold-3), transparent);
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding-top: 8px;
}

.modal-title {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 0.02em;
  background: linear-gradient(135deg, var(--gold-1), var(--gold-3));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.close-btn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--border-subtle);
  color: var(--text-gold);
  font-size: 18px;
  transition: all 0.3s;
}

.close-btn:hover {
  border-color: var(--border-gold);
  background: rgba(201, 162, 39, 0.1);
}

.form-content {
  overflow-y: auto;
  padding-bottom: 20px;
}

.form-content::-webkit-scrollbar {
  width: 4px;
}

.form-content::-webkit-scrollbar-thumb {
  background: var(--gold-4);
  border-radius: 2px;
}

.field {
  margin-bottom: 16px;
}

.field label {
  display: block;
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 8px;
  letter-spacing: 0.05em;
  font-weight: 500;
}

.field input,
.field select,
.field textarea {
  width: 100%;
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  padding: 13px 14px;
  color: var(--text-main);
  font-size: 13px;
  font-family: inherit;
  transition: all 0.3s;
  outline: none;
}

.field input:focus,
.field select:focus,
.field textarea:focus {
  border-color: var(--border-gold-bright);
  box-shadow: var(--glow-gold-soft);
  background: rgba(10, 10, 10, 0.6);
}

.btn-submit {
  width: 100%;
  padding: 16px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--gold-1), var(--gold-3) 60%, var(--gold-4));
  color: #0A0A0A;
  font-weight: 900;
  font-size: 14px;
  letter-spacing: 0.05em;
  transition: all 0.3s;
  box-shadow: var(--glow-gold-soft), inset 0 1px 0 rgba(255,255,255,0.3);
  margin-top: 8px;
}

.btn-submit:hover {
  box-shadow: var(--glow-gold), inset 0 1px 0 rgba(255,255,255,0.4);
  transform: translateY(-2px);
}

.btn-submit:active {
  transform: translateY(0);
}

/* Responsive */
@media (max-width: 500px) {
  .robot-container { width: 70px; height: 70px; }
  .chat-container { height: 210px; }
  .lang-btn { padding: 6px 12px; font-size: 11px; }
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">K</div>
    <span>KAR · AI</span>
  </div>
  <div class="header-actions">
    <button class="icon-circle" title="قطع/وصل صدا" id="muteToggle">🔊</button>
  </div>
</header>

<div class="ai-section">
  <div class="robot-container">
    <div class="robot"></div>
  </div>

  <div class="lang-selector" id="langSelector"></div>

  <div class="chat-container">
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input">
      <button class="btn-icon btn-mic" id="micBtn" title="ضبط صدا">🎤</button>
      <input type="text" id="chatInput" placeholder="اینجا بنویسید یا صحبت کنید…" autocomplete="off">
      <button class="btn-icon btn-send" id="chatSend">↑</button>
    </div>
  </div>
</div>

<div class="branches-section">
  <div class="branches-grid" id="branchGrid"></div>
</div>

<div class="modal-backdrop" id="formModal">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title" id="formTitle">فرم درخواست</h2>
      <button class="close-btn" id="closeFormModal">×</button>
    </div>
    <div class="form-content" id="formContent"></div>
  </div>
</div>
<script>
"use strict";

/* =========================================
   KAR AI V7.0 (LUXURY UI) — PART 2 (DATA)
   Central Assistant + 12 Branches (68 Forms)
========================================= */

const CENTRAL_ASSISTANT = {
  id: "central",
  name: "دستیار KAR AI",
  avatar: "◈",
  greeting: "سلام! من دستیار هوش مصنوعی KAR AI هستم. می‌توانم در انتخاب شاخه مناسب، نحوه ثبت درخواست، کیف پول و همکاری به‌عنوان همکار راهنمایی‌تان کنم. چه کمکی می‌توانم بکنم؟",

<script>
"use strict";

/* =========================================
   KAR AI V7.0 (LUXURY UI) — PART 3 (LOGIC)
   AI Brain, Voice Engine, Hybrid Form Sync
========================================= */

// ---------------- 1. STATE & UTILS ----------------
const appState = {
  lang: "fa", // fa, ar, az, ku, en
  isMuted: false,
  chatMode: "onboarding", // onboarding, ordering, hybrid
  userData: {},
  currentBranch: null,
  currentCategory: null,
  currentForm: null,
  isRecording: false
};

// زبان‌ها و دیکشنری پایه
const LANGUAGES = {
  fa: { code: "fa-IR", label: "فارسی", hello: "سلام! من دستیار هوش مصنوعی KAR AI هستم. بیا با هم حسابت رو بسازیم. اسم کوچیکت چیه؟" },
  ar: { code: "ar-SA", label: "العربية", hello: "مرحباً! أنا مساعد الذكاء الاصطناعي KAR AI. لننشئ حسابك معاً. ما هو اسمك الأول؟" },
  az: { code: "az-AZ", label: "آذری", hello: "Salam! Mən KAR AI süni intellekt köməkçisiyəm. Gəlin hesabınızı yaradaq. Adınız nədir?" },
  ku: { code: "ku-TR", label: "کوردی", hello: "سڵاو! من یاریدەدەری زیرەکی دەستکردی KAR AI یەم. وەرە حسابات بۆ دروست بکەین. ناوی یەکەمت چییە؟" },
  en: { code: "en-US", label: "English", hello: "Hello! I am the KAR AI assistant. Let's create your account. What is your first name?" }
};

// (Mock API - اینجا بعداً به Worker و Gemini وصل می‌شود)
// TODO: Replace with actual fetch to Cloudflare Worker
async function fetchAIResponse(text, lang) {
  // شبیه‌سازی تاخیر هوش مصنوعی
  return new Promise(resolve => setTimeout(() => resolve("mock_response"), 800)); 
}

// پاکسازی و تصحیح متن فارسی (ی/ک عربی به فارسی)
function normalizeText(text) {
  return text.trim()
    .replace(/ي/g, "ی").replace(/ك/g, "ک")
    .replace(/[٠-٩]/g, d => "۰۱۲۳۴۵۶۷۸۹"[d.charCodeAt(0) - 0x0660])
    .replace(/[0-9]/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
}

// ---------------- 2. VOICE ENGINE (STT & TTS) ----------------
const synth = window.speechSynthesis;
let recognition = null;
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
}

function speak(text) {
  if (appState.isMuted || !synth) return;
  synth.cancel(); // قطع صحبت قبلی
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = LANGUAGES[appState.lang].code;
  utterance.rate = 1.0;
  utterance.pitch = 1.0;
  synth.speak(utterance);
}

function startListening() {
  if (!recognition) {
    alert("مرورگر شما از میکروفون پشتیبانی نمی‌کند. لطفاً از کروم استفاده کنید.");
    return;
  }
  recognition.lang = LANGUAGES[appState.lang].code;
  recognition.start();
  appState.isRecording = true;
  document.getElementById("micBtn").classList.add("recording");
}

recognition && (recognition.onresult = function(event) {
  const transcript = event.results[0][0].transcript;
  document.getElementById("chatInput").value = transcript;
  appState.isRecording = false;
  document.getElementById("micBtn").classList.remove("recording");
  handleChatSend(); // ارسال خودکار بعد از صحبت
});

recognition && (recognition.onerror = function() {
  appState.isRecording = false;
  document.getElementById("micBtn").classList.remove("recording");
});

recognition && (recognition.onend = function() {
  appState.isRecording = false;
  document.getElementById("micBtn").classList.remove("recording");
});

// ---------------- 3. CHAT UI ----------------
function addMessage(role, text) {
  const box = document.getElementById("chatMessages");
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  if (role === "bot") speak(text);
}

function setChatInputState(disabled) {
  const input = document.getElementById("chatInput");
  const send = document.getElementById("chatSend");
  input.disabled = disabled;
  send.disabled = disabled;
  if (disabled) {
    input.placeholder = "لطفاً صبر کنید...";
  } else {
    input.placeholder = "اینجا بنویسید یا صحبت کنید…";
    input.focus();
  }
}

// ---------------- 4. LANGUAGE SELECTOR ----------------
function renderLanguageButtons() {
  const container = document.getElementById("langSelector");
  container.innerHTML = "";
  Object.keys(LANGUAGES).forEach(key => {
    const btn = document.createElement("button");
    btn.className = `lang-btn ${appState.lang === key ? "active" : ""}`;
    btn.textContent = LANGUAGES[key].label;
    btn.onclick = () => {
      appState.lang = key;
      renderLanguageButtons();
      addMessage("bot", "زبان گفتار به " + LANGUAGES[key].label + " تغییر یافت. (نوشتار سایت ثابت است)");
      // اگر در مرحله خوش‌آمدگویی بودیم، دوباره سلام کند
      if (appState.chatMode === "onboarding" && Object.keys(appState.userData).length === 0) {
        addMessage("bot", LANGUAGES[key].hello);
      }
    };
    container.appendChild(btn);
  });
}

// ---------------- 5. DYNAMIC FORM RENDERER ----------------
function renderForm(branchSlug, categoryIndex) {
  const data = BRANCHES_DATA[branchSlug];
  const form = data.formsByCategoryIndex[categoryIndex];
  if (!form) return;

  appState.currentBranch = branchSlug;
  appState.currentCategory = categoryIndex;
  appState.currentForm = form;

  document.getElementById("formTitle").textContent = form.title;
  const content = document.getElementById("formContent");
  
  content.innerHTML = `
    <p style="font-size:12px; color:var(--text-muted); margin-bottom:16px;">${form.intro}</p>
    <form id="dynamicForm">
      ${form.fields.map(f => `
        <div class="field">
          <label>${f.label} ${f.required ? '<span style="color:var(--danger)">*</span>' : ''}</label>
          ${f.type === "select" 
            ? `<select id="field-${f.id}" ${f.required ? "required" : ""}><option value="">انتخاب کنید</option>${f.options.map(o => `<option value="${o}">${o}</option>`).join("")}</select>`
            : f.type === "textarea"
              ? `<textarea id="field-${f.id}" rows="3" ${f.required ? "required" : ""}></textarea>`
              : `<input id="field-${f.id}" type="${f.type}" ${f.required ? "required" : ""} min="${f.min || ""}" max="${f.max || ""}">`
          }
        </div>
      `).join("")}
      <button type="submit" class="btn-submit">ثبت نهایی درخواست</button>
    </form>
  `;

  document.getElementById("formModal").classList.add("show");

  // وقتی کاربر فیلدی را دستی تغییر دهد، ربات متوجه شود
  content.querySelectorAll("input, select, textarea").forEach(el => {
    el.addEventListener("change", () => {
      const fieldId = el.id.replace("field-", "");
      const field = form.fields.find(f => f.id === fieldId);
      if (field) {
        addMessage("bot", `متوجه شدم ${field.label} را تغییر دادی. ثبت کردم.`);
      }
    });
  });

  document.getElementById("dynamicForm").addEventListener("submit", (e) => {
    e.preventDefault();
    document.getElementById("formModal").classList.remove("show");
    addMessage("bot", "✅ درخواست شما با موفقیت ثبت شد. کد پیگیری: KAR-" + Math.floor(Math.random()*90000+10000));
    // TODO: fetch('/api/v1/orders', ...)
    appState.chatMode = "ordering"; // برگشت به حالت مکالمه
  });
}

// ---------------- 6. AI BRAIN (ONBOARDING & ORDERING) ----------------
async function processUserInput(text) {
  setChatInputState(true);
  const cleanText = normalizeText(text);
  
  // مرحله ۱: ثبت‌نام (Onboarding)
  if (appState.chatMode === "onboarding") {
    if (!appState.userData.firstName) {
      appState.userData.firstName = cleanText;
      addMessage("bot", `${cleanText} جان، چه اسم قشنگی! فامیلیت چیه؟`);
    } 
    else if (!appState.userData.lastName) {
      appState.userData.lastName = cleanText;
      addMessage("bot", `ممنون ${appState.userData.firstName} ${appState.userData.lastName}. حالا شماره موبایلت رو بگو تا کد تایید برات بفرستم.`);
    }
    else if (!appState.userData.mobile) {
      const mobileRegex = /^09\d{9}$/;
      if (!mobileRegex.test(text)) {
        addMessage("bot", "❌ شماره موبایل نامعتبره. باید ۱۱ رقم باشه و با ۰۹ شروع بشه. دوباره بگو.");
      } else {
        appState.userData.mobile = text;
        addMessage("bot", "✅ کد ۵ رقمی به شماره شما پیامک شد. لطفاً کد رو وارد کن. (فعلاً هر ۵ رقمی رو قبول می‌کنم)");
      }
    }
    else if (!appState.userData.otp) {
      appState.userData.otp = text;
      addMessage("bot", "✅ شماره تایید شد! حالا بریم سراغ محیط اصلی. چه خدمتی نیاز داری؟");
      appState.chatMode = "ordering";
      document.getElementById("userGreeting").textContent = appState.userData.firstName + " عزیز";
    }
    setChatInputState(false);
    return;
  }

  // مرحله ۲: سفارش (Ordering & Hybrid)
  if (appState.chatMode === "ordering") {
    // ۱. تشخیص شاخه
    if (!appState.currentBranch) {
      const branchKeys = Object.keys(BRANCHES_DATA);
      let foundBranch = null;
      for (let key of branchKeys) {
        if (cleanText.includes(BRANCHES_DATA[key].title) || cleanText.includes(BRANCHES_DATA[key].title.replace("ایران ", ""))) {
          foundBranch = key; break;
        }
      }
      if (cleanText.includes("کشاورزی")) foundBranch = "iran_keshavarz";
      if (cleanText.includes("ماشین") || cleanText.includes("حمل")) foundBranch = "iran_transport";
      if (cleanText.includes("خانه") || cleanText.includes("ساختمان")) foundBranch = "iran_building";
      
      if (foundBranch) {
        appState.currentBranch = foundBranch;
        const data = BRANCHES_DATA[foundBranch];
        addMessage("bot", `عالیه! وارد بخش ${data.title} شدیم. چه کاری می‌خوای انجام بدیم؟ (${data.categories.slice(0,3).join("، ")} و...)`);
      } else {
        addMessage("bot", "متوجه نشدم. لطفاً یکی از شاخه‌ها رو بگو یا روی کارت‌های پایین کلیک کن.");
      }
      setChatInputState(false);
      return;
    }

    // ۲. تشخیص دسته
    if (appState.currentCategory === null) {
      const data = BRANCHES_DATA[appState.currentBranch];
      let foundCat = -1;
      data.categories.forEach((cat, i) => {
        if (cleanText.includes(cat) || cat.includes(cleanText)) foundCat = i;
      });
      // کیووردهای خاص
      if (appState.currentBranch === "iran_keshavarz" && cleanText.includes("سم")) foundCat = 0;
      if (appState.currentBranch === "iran_keshavarz" && cleanText.includes("پهپاد")) foundCat = 1;

      if (foundCat > -1) {
        appState.currentCategory = foundCat;
        addMessage("bot", `انتخاب خوبی کردی! فرم «${data.categories[foundCat]}» رو برات باز می‌کنم. بیا با هم پر کنیم...`);
        renderForm(appState.currentBranch, foundCat);
      } else {
        addMessage("bot", `دسته‌های موجود در ${data.title}: ${data.categories.join("، ")}. کدوم رو می‌خوای؟`);
      }
      setChatInputState(false);
      return;
    }

    // ۳. پر کردن فرم (اگر فرم باز است و کاربر در چت چیزی می‌گوید)
    if (appState.currentForm) {
      addMessage("bot", "من فرم رو برات باز کردم. اگر چیزی می‌خوای اضافه کنی یا فیلدی رو پر کنم، فقط بگو (مثلاً بگو مساحت ۱۰ هکتار).");
      // جستجوی عدد در متن برای پر کردن خودکار
      const numMatch = text.match(/\d+/);
      if (numMatch) {
        const fieldId = appState.currentForm.fields[0].id; // فرض می‌کنیم اولین فیلد عددی است (مثل مساحت)
        const input = document.getElementById(`field-${fieldId}`);
        if (input) {
          input.value = numMatch[0];
          addMessage("bot", `عدد ${numMatch[0]} رو توی فیلد ${appState.currentForm.fields[0].label} ثبت کردم.`);
        }
      }
    }
  }
  
  setChatInputState(false);
}

function handleChatSend() {
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if (!text) return;
  
  addMessage("user", text);
  input.value = "";
  processUserInput(text);
}

// ---------------- 7. EVENT LISTENERS & INITIALIZATION ----------------
document.addEventListener("DOMContentLoaded", () => {
  
  // رندر دکمه‌های زبان
  renderLanguageButtons();

  // رندر کارت‌های شاخه
  const branchGrid = document.getElementById("branchGrid");
  Object.keys(BRANCHES_DATA).forEach(key => {
    const branch = BRANCHES_DATA[key];
    const card = document.createElement("div");
    card.className = "branch-card";
    card.innerHTML = `
      <div class="branch-icon-wrap"><div class="branch-icon">${branch.icon}</div></div>
      <span class="branch-name">${branch.title.replace("ایران ", "")}</span>
    `;
    card.onclick = () => {
      // حالت Hybrid: کاربر دستی کلیک کرد
      appState.chatMode = "hybrid";
      appState.currentBranch = key;
      appState.currentCategory = null;
      appState.currentForm = null;
      const catStr = branch.categories.join("، ");
      addMessage("bot", `دیدم که خودت ${branch.title} رو انتخاب کردی. من کنارتم. چه خدمتی از این بخش می‌خوای؟ (${catStr})`);
    };
    branchGrid.appendChild(card);
  });

  // چت: ارسال
  document.getElementById("chatSend").addEventListener("click", handleChatSend);
  document.getElementById("chatInput").addEventListener("keypress", (e) => {
    if (e.key === "Enter") handleChatSend();
  });

  // میکروفون
  document.getElementById("micBtn").addEventListener("click", () => {
    if (appState.isRecording) {
      recognition.stop();
    } else {
      startListening();
    }
  });

  // قطع/وصل صدا
  document.getElementById("muteToggle").addEventListener("click", function() {
    appState.isMuted = !appState.isMuted;
    this.textContent = appState.isMuted ? "🔇" : "🔊";
    if (appState.isMuted && synth) synth.cancel();
  });

  // بستن مودال فرم
  document.getElementById("closeFormModal").addEventListener("click", () => {
    document.getElementById("formModal").classList.remove("show");
    addMessage("bot", "فرم رو بستم. اگر باز هم کمکی خواستی بگو.");
    appState.chatMode = "ordering";
  });

  // شروع مکالمه اولیه (ربات سلام می‌کند)
  setTimeout(() => {
    addMessage("bot", LANGUAGES[appState.lang].hello);
  }, 1000);

  console.log("%c[KAR AI] Luxury UI + AI Brain Ready ✨", "color: #F5D76E; font-size: 16px; font-weight: bold;");
});
</script>
