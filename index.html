<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>KAR AI | اکوسیستم هوشمند لوکس</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #050505;
  --bg-card: rgba(20, 20, 22, 0.72);
  --bg-card-hover: rgba(30, 30, 35, 0.9);
  --gold-1: #F5E6B8;
  --gold-2: #F5D76E;
  --gold-3: #C9A227;
  --gold-4: #8B6914;
  --text-main: #F2F2F2;
  --text-muted: #9A9A9A;
  --border-gold: rgba(201, 162, 39, 0.35);
  --glow-gold: 0 0 40px rgba(201, 162, 39, 0.25);
  --glow-gold-soft: 0 0 20px rgba(201, 162, 39, 0.15);
  --radius: 24px;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
body { background: var(--bg-deep); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: relative; font-size: 16px; }
body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(circle at 50% 0%, rgba(201, 162, 39, 0.12) 0%, transparent 60%); pointer-events: none; z-index: 0; }

button { cursor: pointer; border: none; outline: none; background: transparent; font-family: inherit; }

/* ================= صفحه ۱: ثبت‌نام (Onboarding) ================= */
#onboardingScreen {
  position: absolute; inset: 0; z-index: 100; background: var(--bg-deep);
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px;
  transition: opacity 0.5s ease; overflow-y: auto;
}
#onboardingScreen.hidden { opacity: 0; pointer-events: none; }

/* ربات لوکس */
.robot-wrapper { position: relative; margin-bottom: 30px; animation: float 4s ease-in-out infinite; }
.robot-head {
  width: 110px; height: 100px; border-radius: 30px;
  background: linear-gradient(135deg, var(--gold-1), var(--gold-3), var(--gold-4));
  border: 3px solid var(--gold-2); box-shadow: var(--glow-gold);
  position: relative; display: flex; justify-content: center; align-items: center; gap: 20px;
}
.robot-eye { width: 20px; height: 30px; background: #050505; border-radius: 10px; box-shadow: inset 0 3px 6px rgba(255,255,255,0.3); animation: blink 4s infinite; }
.robot-antenna { position: absolute; top: -26px; left: 50%; transform: translateX(-50%); width: 6px; height: 26px; background: var(--gold-3); }
.robot-antenna::after { content: ''; position: absolute; top: -10px; left: -6px; width: 18px; height: 18px; background: var(--gold-2); border-radius: 50%; box-shadow: 0 0 20px var(--gold-2); }
.robot-mouth { position: absolute; bottom: 16px; width: 40px; height: 8px; background: #050505; border-radius: 4px; opacity: 0.7; }

@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
@keyframes blink { 0%, 96%, 100% { transform: scaleY(1); } 98% { transform: scaleY(0.1); } }

/* کادر چت ثبت‌نام */
.chat-box-auth {
  width: 100%; max-width: 520px; background: var(--bg-card); border: 1px solid var(--border-gold);
  border-radius: var(--radius); box-shadow: var(--glow-gold-soft); display: flex; flex-direction: column; overflow: hidden; height: 400px;
}
.chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: 85%; padding: 14px 18px; border-radius: 18px; font-size: 14px; line-height: 1.7; animation: msgIn 0.3s forwards; }
@keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.msg.bot { align-self: flex-start; background: rgba(201, 162, 39, 0.1); border: 1px solid var(--border-gold); color: var(--gold-1); border-bottom-right-radius: 4px; }
.msg.user { align-self: flex-end; background: linear-gradient(135deg, var(--gold-2), var(--gold-4)); color: #000; font-weight: bold; border-bottom-left-radius: 4px; }

.chat-input-area { display: flex; padding: 12px; background: rgba(0,0,0,0.4); border-top: 1px solid var(--border-gold); gap: 8px; }
.chat-input-area input { flex: 1; background: transparent; border: none; color: white; padding: 10px; outline: none; font-size: 14px; }
.chat-input-area button { background: var(--gold-3); color: #000; width: 46px; height: 46px; border-radius: 12px; font-weight: 900; font-size: 18px; }
.btn-guest { margin-top: 20px; color: var(--text-muted); text-decoration: underline; cursor: pointer; font-size: 14px; padding: 10px; }
.btn-guest:hover { color: var(--gold-2); }

/* ================= صفحه ۲: داشبورد اصلی (Main) ================= */
#mainScreen {
  position: absolute; inset: 0; display: flex; flex-direction: column; z-index: 10;
  transform: translateY(100%); transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); overflow-y: auto;
}
#mainScreen.active { transform: translateY(0); }

header { padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(5,5,5,0.8); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 20; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 900; color: var(--gold-2); letter-spacing: 2px; font-size: 18px; }
#userLabel { font-size: 13px; color: var(--gold-1); background: rgba(201, 162, 39, 0.1); padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border-gold); }

/* ربات بالای داشبورد */
.main-robot { display: flex; justify-content: center; padding: 20px 0 10px; }
.main-robot .robot-head { width: 90px; height: 80px; border-radius: 24px; gap: 16px; }
.main-robot .robot-eye { width: 16px; height: 24px; }
.main-robot .robot-antenna { height: 20px; top: -20px; }
.main-robot .robot-mouth { width: 30px; bottom: 12px; height: 6px; }

/* نوار افقی (کسب‌وکارهای مهم) */
.featured-strip-wrapper { padding: 10px 24px 20px; overflow-x: auto; scrollbar-width: none; }
.featured-strip-wrapper::-webkit-scrollbar { display: none; }
.featured-strip { display: flex; gap: 16px; width: max-content; }
.featured-item {
  background: linear-gradient(180deg, rgba(30,30,30,0.9), rgba(15,15,15,0.9));
  border: 1px solid var(--border-gold); border-radius: 20px; padding: 16px 24px;
  display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 120px;
  cursor: grab; transition: 0.3s;
}
.featured-item:hover { box-shadow: var(--glow-gold-soft); transform: translateY(-4px); }
.featured-item .icon { font-size: 36px; }
.featured-item span { font-size: 13px; font-weight: bold; color: var(--gold-1); text-align: center; }

/* گرید ۱۲ شاخه */
.branches-grid {
  padding: 10px 24px 100px;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; align-content: start;
}
@media(max-width: 600px) { .branches-grid { grid-template-columns: repeat(3, 1fr); gap: 12px; } }

.branch-card {
  background: var(--bg-card); border-radius: 20px; padding: 16px 10px;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; cursor: pointer;
}
.branch-card:hover { border-color: var(--border-gold); box-shadow: var(--glow-gold-soft); transform: translateY(-3px); }
.branch-card:active { transform: scale(0.95); }
.branch-card .icon-circle {
  width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle, rgba(201, 162, 39, 0.15), transparent);
  border: 2px solid var(--border-gold); font-size: 32px;
}
.branch-card span { font-size: 12px; font-weight: 700; color: var(--gold-1); text-align: center; }

/* دکمه شناور چت هوش مصنوعی */
.fab-chat {
  position: fixed; bottom: 24px; left: 24px; z-index: 50;
  width: 64px; height: 64px; border-radius: 50%;
  background: linear-gradient(135deg, var(--gold-2), var(--gold-4));
  box-shadow: var(--glow-gold); display: grid; place-items: center; font-size: 28px; color: #000;
  transition: 0.3s; border: 3px solid var(--gold-1); font-weight: 900;
}
.fab-chat:hover { transform: scale(1.1); }

/* ================= مودال‌های سفارش و چت ================= */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(6px);
  display: none; align-items: flex-end; justify-content: center; z-index: 200;
}
.modal-backdrop.show { display: flex; }
.modal {
  background: linear-gradient(180deg, #14141A, #0A0A0E); width: 100%; max-width: 600px;
  border-radius: 28px 28px 0 0; padding: 20px; max-height: 90vh; display: flex; flex-direction: column;
  animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); border-top: 1px solid var(--border-gold);
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-title { font-size: 17px; font-weight: 900; color: var(--gold-1); }
.close-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,0.05); color: var(--gold-2); font-size: 22px; }

/* فرم‌های داینامیک */
.form-content { overflow-y: auto; padding-bottom: 20px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; color: var(--gold-1); margin-bottom: 6px; }
.field input, .field select, .field textarea { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid var(--border-gold); border-radius: 12px; padding: 14px; color: white; font-size: 14px; font-family: inherit; outline: none; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--gold-2); box-shadow: var(--glow-gold-soft); }
.btn-submit { width: 100%; padding: 16px; border-radius: 14px; background: linear-gradient(135deg, var(--gold-2), var(--gold-4)); color: #000; font-weight: 900; font-size: 15px; margin-top: 10px; }

/* چت داخل مودال */
.chat-box-dash { height: 60vh; border-radius: 28px 28px 0 0; width: 100%; max-width: 600px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--border-gold); background: var(--bg-card); }
</style>
</head>

<!-- ================= صفحه ثبت نام ================= -->
<div id="onboardingScreen">

<script>
"use strict";

/* =========================================
   KAR AI V8.0 (LUXURY UI) — PART 3 (AI LOGIC)
========================================= */

// ---------------- 1. STATE & CONFIG ----------------
const appState = {
  lang: "fa", // fa, ar, az, ku, en
  isMuted: false,
  user: { name: "مهمان", isGuest: true },
  onboardingStep: 0, // 0: Start, 1: Name, 2: Last, 3: Mobile, 4: Done
  chatMode: "idle", // idle, ai_chat, form_open
  currentBranch: null,
  currentCategory: null,
  currentForm: null
};

// زبان‌ها و دیکشنری پایه (فقط برای مکالمه AI - نوشتار سایت همیشه فارسی است)
const LANGUAGES = {
  fa: { code: "fa-IR", label: "فارسی", hello: "سلام! من دستیار هوش مصنوعی KAR AI هستم. اسم کوچیکت چیه تا حسابت رو بسازیم؟" },
  ar: { code: "ar-SA", label: "العربية", hello: "مرحباً! أنا مساعد الذكاء الاصطناعي KAR AI. ما هو اسمك الأول؟" },
  az: { code: "az-AZ", label: "آذری", hello: "Salam! Mən KAR AI süni intellekt köməkçisiyəm. Adınız nədir?" },
  ku: { code: "ku-TR", label: "کوردی", hello: "سڵاو! من یاریدەدەری زیرەکی دەستکردی KAR AI یەم. ناوی یەکەمت چییە؟" },
  en: { code: "en-US", label: "English", hello: "Hello! I am the KAR AI assistant. What is your first name?" }
};

// ---------------- 2. VOICE ENGINE (STT & TTS) ----------------
const synth = window.speechSynthesis;
let recognition = null;
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
}

function speak(text) {
  if (appState.isMuted || !synth) return;
  synth.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = LANGUAGES[appState.lang].code;
  utterance.rate = 1.0;
  synth.speak(utterance);
}

function startListening(inputId) {
  if (!recognition) {
    alert("مرورگر شما از میکروفون پشتیبانی نمی‌کند. لطفاً از کروم استفاده کنید.");
    return;
  }
  recognition.lang = LANGUAGES[appState.lang].code;
  recognition.start();
  const micBtn = document.getElementById("micBtnOnb") || document.getElementById("micBtnDash");
  if(micBtn) micBtn.classList.add("recording");
  
  recognition.onresult = function(event) {
    const transcript = event.results[0][0].transcript;
    document.getElementById(inputId).value = transcript;
    if(micBtn) micBtn.classList.remove("recording");
    // ارسال خودکار
    if(inputId === "onboardingInput") handleOnboardingInput();
    else if(inputId === "dashChatInput") handleDashboardChat();
  };

  recognition.onerror = function() { if(micBtn) micBtn.classList.remove("recording"); };
  recognition.onend = function() { if(micBtn) micBtn.classList.remove("recording"); };
}

// ---------------- 3. ONBOARDING LOGIC (ثبت‌نام) ----------------
const onbChat = document.getElementById("onboardingChat");
const onbInput = document.getElementById("onboardingInput");

// دکمه‌های انتخاب زبان را در صفحه ثبت‌نام می‌سازیم
function renderLangSelector() {
  const wrapper = document.createElement("div");
  wrapper.style.cssText = "display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; justify-content:center;";
  Object.keys(LANGUAGES).forEach(key => {
    const btn = document.createElement("button");
    btn.style.cssText = `padding:6px 14px; border-radius:20px; font-size:12px; border:1px solid var(--border-gold); background:${appState.lang === key ? 'var(--gold-3)' : 'transparent'}; color:${appState.lang === key ? '#000' : 'var(--gold-1)'};`;
    btn.textContent = LANGUAGES[key].label;
    btn.onclick = () => {
      appState.lang = key;
      renderLangSelector(); // رفرش
      addMsg(onbChat, LANGUAGES[key].hello, "bot");
    };
    wrapper.appendChild(btn);
  });
  const robotWrap = document.querySelector(".robot-wrapper");
  if(!document.getElementById("langWrapper")) {
      wrapper.id = "langWrapper";
      robotWrap.parentNode.insertBefore(wrapper, robotWrap.nextSibling);
  }
}

function startOnboarding() {
  renderLangSelector();
  setTimeout(() => {
    addMsg(onbChat, LANGUAGES[appState.lang].hello, "bot");
    appState.onboardingStep = 1;
  }, 500);
}

function handleOnboardingInput() {
  const val = onbInput.value.trim();
  if (!val) return;
  addMsg(onbChat, val, "user");
  onbInput.value = "";

  setTimeout(() => {
    if (appState.onboardingStep === 1) {
      appState.user.name = val;
      addMsg(onbChat, `خوشبختم ${val} جان! فامیلیت چیه؟`, "bot");
      appState.onboardingStep = 2;
    } else if (appState.onboardingStep === 2) {
      appState.user.last = val;
      addMsg(onbChat, `ممنون. شماره موبایلت رو وارد کن (مثلاً 09123456789).`, "bot");
      appState.onboardingStep = 3;
    } else if (appState.onboardingStep === 3) {
      if (val.length < 10) {
        addMsg(onbChat, "شماره موبایل نامعتبره. دوباره وارد کن.", "bot");
      } else {
        appState.user.mobile = val;
        addMsg(onbChat, "✅ ثبت‌نام شما با موفقیت انجام شد! در حال ورود به داشبورد...", "bot");
        appState.onboardingStep = 4;
        appState.user.isGuest = false;
        setTimeout(goToMainScreen, 1500);
      }
    }
  }, 600);
}

document.getElementById("onboardingSend").addEventListener("click", handleOnboardingInput);
onbInput.addEventListener("keypress", (e) => { if(e.key === "Enter") handleOnboardingInput(); });

document.getElementById("btnGuest").addEventListener("click", () => {
  appState.user.isGuest = true;
  appState.user.name = "مهمان";
  goToMainScreen();
});

// ---------------- 4. MAIN SCREEN (داشبورد) ----------------
function goToMainScreen() {
  document.getElementById("onboardingScreen").classList.add("hidden");
  document.getElementById("mainScreen").classList.add("active");
  document.getElementById("userLabel").textContent = appState.user.isGuest ? "مهمان" : appState.user.name + " عزیز";
  
  renderDashboard();
}

function renderDashboard() {
  // نوار افقی (Featured)
  const featured = ["iran_keshavarz", "iran_transport", "iran_legal", "iran_education"];
  const strip = document.getElementById("featuredStrip");
  strip.innerHTML = "";
  featured.forEach(key => {
    const d = BRANCHES_DATA[key];
    const div = document.createElement("div");
    div.className = "featured-item";
    div.innerHTML = `<div class="icon">${d.icon}</div><span>${d.title}</span>`;
    div.onclick = () => openBranchInChat(d.title);
    strip.appendChild(div);
  });

  // گرید ۱۲ آیکون
  const grid = document.getElementById("branchGrid");
  grid.innerHTML = "";
  Object.keys(BRANCHES_DATA).forEach(key => {
    const d = BRANCHES_DATA[key];
    const card = document.createElement("div");
    card.className = "branch-card";
    card.innerHTML = `<div class="icon-circle">${d.icon}</div><span>${d.title}</span>`;
    card.onclick = () => openBranchInChat(d.title);
    grid.appendChild(card);
  });
}

// ---------------- 5. CHAT & AI (تعامل دوطرفه) ----------------
const dashChatModal = document.getElementById("chatModal");
const dashChatBox = document.getElementById("dashChatMessages");
const dashInput = document.getElementById("dashChatInput");

function addMsg(box, text, role) {
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  if (role === "bot") speak(text);
}

document.getElementById("fabChat").addEventListener("click", () => {
  dashChatModal.classList.add("show");
  dashInput.focus();
});
document.getElementById("closeChatModal").addEventListener("click", () => {
  dashChatModal.classList.remove("show");
});

// وقتی کاربر روی کارت شاخه کلیک می‌کند (Hybrid Mode)
function openBranchInChat(branchTitle) {
  appState.currentBranch = null; // ریست
  appState.currentCategory = null;
  appState.currentForm = null;
  
  dashChatModal.classList.add("show");
  addMsg(dashChatBox, `کاربر روی ${branchTitle} کلیک کرد.`, "user");
  
  setTimeout(() => {
    const key = Object.keys(BRANCHES_DATA).find(k => BRANCHES_DATA[k].title === branchTitle);
    appState.currentBranch = key;
    const data = BRANCHES_DATA[key];
    addMsg(dashChatBox, `عالیه! وارد بخش ${data.title} شدیم. چه کاری از این بخش می‌خوای انجام بدیم؟ (${data.categories.slice(0,3).join("، ")}...)`, "bot");
  }, 600);
}

// ارسال پیام توسط کاربر در داشبورد
function handleDashboardChat() {
  const text = dashInput.value.trim();
  if (!text) return;
  addMsg(dashChatBox, text, "user");
  dashInput.value = "";
  
  setTimeout(() => {
    processAILogic(text);
  }, 800);
}

document.getElementById("dashChatSend").addEventListener("click", handleDashboardChat);
dashInput.addEventListener("keypress", (e) => { if(e.key === "Enter") handleDashboardChat(); });

// موتور اصلی هوش مصنوعی (شبیه‌سازی)
function processAILogic(text) {
  // ۱. تشخیص شاخه
  if (!appState.currentBranch) {
    let found = null;
    if (text.includes("کشاورزی") || text.includes("سم") || text.includes("پهپاد")) found = "iran_keshavarz";
    else if (text.includes("ماشین") || text.includes("حمل") || text.includes("بار")) found = "iran_transport";
    else if (text.includes("خانه") || text.includes("لوله") || text.includes("برق")) found = "iran_building";
    
    if (found) {
      appState.currentBranch = found;
      const data = BRANCHES_DATA[found];
      addMsg(dashChatBox, `عالیه! وارد بخش ${data.title} شدیم. چه خدمتی می‌خوای؟ (${data.categories.join("، ")})`, "bot");
    } else {
      addMsg(dashChatBox, "متوجه نشدم. لطفاً یکی از شاخه‌ها رو بگو (مثلاً کشاورزی، حمل‌ونقل) یا روی کارت‌های پایین کلیک کن.", "bot");
    }
    return;
  }

  // ۲. تشخیص دسته
  if (appState.currentBranch && appState.currentCategory === null) {
    const data = BRANCHES_DATA[appState.currentBranch];
    let foundIdx = -1;
    data.categories.forEach((cat, i) => {
      if (text.includes(cat) || cat.includes(text)) foundIdx = i;
    });
    // کیووردهای خاص
    if (appState.currentBranch === "iran_keshavarz" && text.includes("سم")) foundIdx = 0;
    if (appState.currentBranch === "iran_keshavarz" && text.includes("پهپاد")) foundIdx = 1;

    if (foundIdx > -1) {
      appState.currentCategory = foundIdx;
      addMsg(dashChatBox, `انتخاب خوبی کردی! فرم «${data.categories[foundIdx]}» رو برات باز می‌کنم. اطلاعات رو بگو تا پر کنم...`, "bot");
      renderForm(appState.currentBranch, foundIdx);
    } else {
      addMsg(dashChatBox, `دسته‌های موجود در این بخش: ${data.categories.join("، ")}. کدوم رو می‌خوای؟`, "bot");
    }
    return;
  }

  // ۳. اگر فرم باز است، تلاش برای پر کردن فیلدها با حرف کاربر
  if (appState.currentForm) {
    const form = appState.currentForm;
    let filled = false;
    
    // جستجوی عدد برای فیلدهای Number
    const numMatch = text.match(/\d+/);
    if (numMatch) {
      const numField = form.fields.find(f => f.type === "number" && !document.getElementById(`field-${f.id}`).value);
      if (numField) {
        document.getElementById(`field-${numField.id}`).value = numMatch[0];
        addMsg(dashChatBox, `عدد ${numMatch[0]} رو توی فیلد «${numField.label}» ثبت کردم.`, "bot");
        filled = true;
      }
    }
    
    // جستجوی کلمات برای فیلدهای Select یا Text
    if (!filled) {
      addMsg(dashChatBox, "فرم برات بازه. می‌تونی خودت دستی پر کنی یا اگر فیلدی مونده بهم بگو تا پر کنم. در نهایت روی «ثبت نهایی» بزن.", "bot");
    }
  }
}

// ---------------- 6. DYNAMIC FORM ENGINE ----------------
function renderForm(branchSlug, categoryIndex) {
  const data = BRANCHES_DATA[branchSlug];
  const form = data.formsByCategoryIndex[categoryIndex];
  if (!form) return;

  appState.currentBranch = branchSlug;
  appState.currentCategory = categoryIndex;
  appState.currentForm = form;

  document.getElementById("formTitle").textContent = form.title;
  const content = document.getElementById("formContent");
  
  content.innerHTML = `
    <p style="font-size:13px; color:var(--text-muted); margin-bottom:20px;">${form.intro}</p>
    <form id="dynamicForm">
      ${form.fields.map(f => `
        <div class="field">
          <label>${f.label} ${f.required ? '<span style="color:red">*</span>' : ''}</label>
          ${f.type === "select" 
            ? `<select id="field-${f.id}" ${f.required ? "required" : ""}><option value="">انتخاب کنید</option>${f.options.map(o => `<option value="${o}">${o}</option>`).join("")}</select>`
            : f.type === "textarea"
              ? `<textarea id="field-${f.id}" rows="3" ${f.required ? "required" : ""}></textarea>`
              : `<input id="field-${f.id}" type="${f.type}" ${f.required ? "required" : ""} min="${f.min || ""}" max="${f.max || ""}">`
          }
        </div>
      `).join("")}
      <button type="submit" class="btn-submit">ثبت نهایی درخواست</button>
    </form>
  `;

  document.getElementById("formModal").classList.add("show");
  
  // بستن مودال چت تا کاربر فرم رو ببینه
  dashChatModal.classList.remove("show");

  // لیسنر ثبت فرم
  document.getElementById("dynamicForm").addEventListener("submit", (e) => {
    e.preventDefault();
    document.getElementById("formModal").classList.remove("show");
    
    // بستن فرم و پیام موفقیت
    dashChatModal.classList.add("show");
    addMsg(dashChatBox, "✅ درخواست شما با موفقیت ثبت شد! کد پیگیری: KAR-" + Math.floor(Math.random()*90000+10000), "bot");
    
    // ریست کردن حالت برای سفارش بعدی
    appState.currentBranch = null;
    appState.currentCategory = null;
    appState.currentForm = null;
  });
}

document.getElementById("closeFormModal").addEventListener("click", () => {
  document.getElementById("formModal").classList.remove("show");
  dashChatModal.classList.add("show");
  addMsg(dashChatBox, "فرم رو بستم. اگر خواستی دوباره پر کنیم بگو.", "bot");
});

// ---------------- INITIALIZATION ----------------
document.addEventListener("DOMContentLoaded", () => {
  // شروع صفحه ثبت‌نام
  startOnboarding();
  console.log("%c[KAR AI] Luxury AI System Ready ✨", "color: #F5D76E; font-size: 16px; font-weight: bold;");
});
</script>
