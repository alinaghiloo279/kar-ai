<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>KAR AI | ورود به اکوسیستم</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #F5F7FA; /* پس‌زمینه سفید مایل به آبی (مدرن) */
  --bg-card: #FFFFFF;
  --gold-1: #D4AF37;
  --gold-2: #C9A227;
  --gold-3: #8B6914;
  --text-main: #2C3E50;
  --text-muted: #7F8C8D;
  --border-color: rgba(0,0,0,0.06);
  --border-gold: rgba(212, 175, 55, 0.3);
  --shadow-soft: 0 10px 30px rgba(0,0,0,0.05);
  --shadow-gold: 0 10px 25px rgba(212, 175, 55, 0.2);
  --radius: 24px;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
body { background: var(--bg-deep); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: relative; font-size: 16px; }

button { cursor: pointer; border: none; outline: none; background: transparent; font-family: inherit; transition: 0.3s; }

/* ================= صفحه ۱: ورود و ثبت‌نام ================= */
#onboardingScreen {
  position: absolute; inset: 0; z-index: 100; background: var(--bg-deep);
  display: flex; flex-direction: column; align-items: center; padding: 30px 20px;
  overflow-y: auto; z-index: 10;
}
#onboardingScreen.hidden { opacity: 0; pointer-events: none; }

/* هدر لاگین */
.login-header { text-align: center; margin-bottom: 20px; margin-top: 10px; }
.login-header h1 { font-size: 28px; font-weight: 900; color: var(--text-main); letter-spacing: 2px; margin-bottom: 8px; }
.login-header h1 span { color: var(--gold-2); }
.login-header p { font-size: 14px; color: var(--text-muted); }

/* ربات هوش مصنوعی (هسته شناور) */
.robot-wrapper { position: relative; margin-bottom: 20px; animation: float 4s ease-in-out infinite; display: flex; justify-content: center; }
.robot-svg { width: 140px; height: 140px; filter: drop-shadow(0 15px 25px rgba(0,0,0,0.15)); }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.eye-glow { animation: blink 5s infinite; transform-origin: center; }
@keyframes blink { 0%, 96%, 100% { transform: scaleY(1); } 98% { transform: scaleY(0.1); } }

/* انتخاب زبان */
.lang-selector { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; justify-content: center; }
.lang-btn { padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: bold; border: 1px solid var(--border-color); color: var(--text-muted); background: var(--bg-card); box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
.lang-btn.active { background: linear-gradient(135deg, var(--gold-1), var(--gold-2)); color: #fff; border-color: var(--gold-2); box-shadow: var(--shadow-gold); }

/* کادر چت و فرم */
.auth-container {
  width: 100%; max-width: 480px; background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: var(--radius); box-shadow: var(--shadow-soft); display: flex; flex-direction: column; overflow: hidden;
}
.chat-messages { padding: 20px; display: flex; flex-direction: column; gap: 12px; max-height: 250px; overflow-y: auto; }
.msg { max-width: 90%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.6; animation: msgIn 0.3s forwards; }
@keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.msg.bot { align-self: flex-start; background: #F0F4F8; color: var(--text-main); border-bottom-right-radius: 4px; }
.msg.user { align-self: flex-end; background: var(--text-main); color: #fff; font-weight: bold; border-bottom-left-radius: 4px; }

/* فرم ورود داخل باکس */
.auth-form { padding: 16px; border-top: 1px solid var(--border-color); background: #FAFAFA; }
.input-group { display: flex; gap: 8px; margin-bottom: 12px; }
.input-group input { flex: 1; background: #fff; border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; color: var(--text-main); font-size: 14px; outline: none; transition: 0.3s; }
.input-group input:focus { border-color: var(--gold-2); box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15); }
.btn-primary { width: 100%; background: linear-gradient(135deg, var(--gold-1), var(--gold-2)); color: #fff; font-weight: 900; padding: 15px; border-radius: 12px; font-size: 15px; box-shadow: var(--shadow-gold); }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4); }
.btn-primary:active { transform: translateY(0); }

/* لینک‌های پایین */
.auth-links { display: flex; justify-content: space-between; width: 100%; max-width: 480px; margin-top: 20px; }
.auth-link { font-size: 13px; color: var(--text-muted); border-bottom: 1px dashed var(--text-muted); padding-bottom: 2px; }
.auth-link:hover { color: var(--gold-2); border-color: var(--gold-2); }

/* ================= صفحه ۲: داشبورد اصلی ================= */
#mainScreen {
  position: absolute; inset: 0; display: flex; flex-direction: column; z-index: 10;
  transform: translateY(100%); transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); overflow-y: auto; background: var(--bg-deep);
}
#mainScreen.active { transform: translateY(0); }

header { padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 20; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 900; color: var(--text-main); letter-spacing: 2px; font-size: 20px; }
.logo span { color: var(--gold-2); }
#userLabel { font-size: 13px; color: var(--gold-2); background: rgba(212, 175, 55, 0.1); padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border-gold); font-weight: bold; }

.main-robot { display: flex; justify-content: center; padding: 20px 0 10px; }

/* نوار افقی (کسب‌وکارهای مهم) */
.featured-strip-wrapper { padding: 10px 24px 20px; overflow-x: auto; scrollbar-width: none; }
.featured-strip-wrapper::-webkit-scrollbar { display: none; }
.featured-strip { display: flex; gap: 16px; width: max-content; }
.featured-item {
  background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; padding: 16px 24px;
  display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 120px;
  cursor: pointer; box-shadow: var(--shadow-soft); transition: 0.3s;
}
.featured-item:hover { box-shadow: var(--shadow-gold); transform: translateY(-4px); border-color: var(--border-gold); }
.featured-item .icon { font-size: 36px; }
.featured-item span { font-size: 13px; font-weight: bold; color: var(--text-main); text-align: center; }

/* گرید ۱۲ آیکون (سه بعدی و کوچکتر) */
.branches-grid { padding: 10px 24px 100px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; align-content: start; }
@media(max-width: 600px) { .branches-grid { grid-template-columns: repeat(3, 1fr); gap: 12px; } }

.branch-card {
  background: var(--bg-card); border-radius: 18px; padding: 16px 10px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  border: 1px solid var(--border-color); cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.03);
  transition: 0.3s;
}
.branch-card:hover { border-color: var(--border-gold); box-shadow: var(--shadow-gold); transform: translateY(-3px); }

/* افکت 3D برای آیکون‌ها */
.branch-card .icon-circle {
  width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center;
  background: linear-gradient(135deg, #ffffff, #e6e9ef); /* نور از بالا سمت چپ */
  box-shadow: 
    4px 4px 10px rgba(0,0,0,0.08), /* سایه تیره */
    -4px -4px 10px rgba(255,255,255,1), /* هایلایت روشن */
    inset 0 0 0 1px rgba(255,255,255,0.5);
  font-size: 28px;
  border: 1px solid rgba(212, 175, 55, 0.2);
  transition: 0.3s;
}
.branch-card:hover .icon-circle {
  box-shadow: 
    6px 6px 15px rgba(212, 175, 55, 0.2), 
    -4px -4px 10px rgba(255,255,255,1),
    inset 0 0 0 1px rgba(212, 175, 55, 0.4);
}
.branch-card span { font-size: 12px; font-weight: 700; color: var(--text-main); text-align: center; }

/* دکمه شناور چت */
.fab-chat {
  position: fixed; bottom: 24px; left: 24px; z-index: 50;
  width: 64px; height: 64px; border-radius: 50%;
  background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
  box-shadow: var(--shadow-gold); display: grid; place-items: center; font-size: 28px; color: #fff;
  border: 3px solid #fff; font-weight: 900;
}
.fab-chat:hover { transform: scale(1.1); }

/* مودال‌ها */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); display: none; align-items: flex-end; justify-content: center; z-index: 200; }
.modal-backdrop.show { display: flex; }
.modal { background: var(--bg-card); width: 100%; max-width: 600px; border-radius: 28px 28px 0 0; padding: 24px; max-height: 90vh; display: flex; flex-direction: column; animation: slideUp 0.4s ease-out; box-shadow: 0 -10px 40px rgba(0,0,0,0.1); }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-title { font-size: 17px; font-weight: 900; color: var(--text-main); }
.close-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: #F0F4F8; color: var(--text-muted); font-size: 22px; }
.close-btn:hover { background: #E2E8F0; color: #ff5252; }

.form-content { overflow-y: auto; padding-bottom: 20px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; color: var(--text-main); margin-bottom: 6px; font-weight: bold; }
.field input, .field select, .field textarea { width: 100%; background: #F8F9FA; border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; color: var(--text-main); font-size: 14px; outline: none; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--gold-2); background: #fff; box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15); }
.btn-submit { width: 100%; padding: 16px; border-radius: 14px; background: linear-gradient(135deg, var(--gold-1), var(--gold-2)); color: #fff; font-weight: 900; font-size: 15px; margin-top: 10px; box-shadow: var(--shadow-gold); }

.chat-box-dash { height: 65vh; border-radius: 28px 28px 0 0; width: 100%; max-width: 600px; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-card); }
.chat-box-dash .chat-messages { flex: 1; max-height: none; }
.chat-input-area { display: flex; padding: 12px; background: #FAFAFA; border-top: 1px solid var(--border-color); gap: 8px; }
.chat-input-area input { flex: 1; background: #fff; border: 1px solid var(--border-color); border-radius: 12px; padding: 12px 14px; color: var(--text-main); font-size: 14px; outline: none; }
.chat-input-area input:focus { border-color: var(--gold-2); }
.chat-input-area button { background: var(--gold-2); color: #fff; width: 46px; height: 46px; border-radius: 12px; font-weight: 900; font-size: 18px; box-shadow: 0 4px 10px rgba(212, 175, 55, 0.3); }
</style>
</head>
<body>

<!-- ================= صفحه ورود ================= -->
<div id="onboardingScreen">
  
  <div class="login-header">
    <h1>KAR <span>AI</span></h1>
    <p>به اکوسیستم هوشمند خدمات خوش آمدید</p>
  </div>

  <!-- ربات هوش مصنوعی (هسته شناور) -->
  <div class="robot-wrapper">
    <svg class="robot-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <!-- حلقه‌های نورانی زیر ربات -->
      <ellipse cx="100" cy="165" rx="60" ry="15" fill="rgba(212, 175, 55, 0.1)" />
      <ellipse cx="100" cy="160" rx="40" ry="8" fill="rgba(212, 175, 55, 0.2)" />
      
      <!-- بدنه اصلی ربات (Housing) -->
      <rect x="55" y="40" width="90" height="100" rx="45" fill="url(#gradHousing)" stroke="rgba(212, 175, 55, 0.4)" stroke-width="2"/>
      
      <!-- صفحه مشکی (Visor) -->
      <rect x="65" y="60" width="70" height="55" rx="27.5" fill="#111111" />
      
      <!-- چشم‌های نئونی -->
      <g class="eye-glow">
        <path d="M 80 85 Q 80 75 90 75 Q 100 75 100 85 Q 100 95 90 95 Q 80 95 80 85 Z" fill="#00E5FF" />
        <path d="M 100 85 Q 100 75 110 75 Q 120 75 120 85 Q 120 95 110 95 Q 100 95 100 85 Z" fill="#00E5FF" />
        <!-- انعکاس نور چشم -->
        <circle cx="85" cy="80" r="3" fill="#FFFFFF" opacity="0.8"/>
        <circle cx="105" cy="80" r="3" fill="#FFFFFF" opacity="0.8"/>
      </g>
      
      <!-- نقطه‌های نورانی روی بدنه -->
      <circle cx="100" cy="130" r="3" fill="#D4AF37" opacity="0.6"/>
      <circle cx="85" cy="130" r="2" fill="#D4AF37" opacity="0.3"/>
      <circle cx="115" cy="130" r="2" fill="#D4AF37" opacity="0.3"/>
      
      <defs>
        <linearGradient id="gradHousing" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#FFFFFF"/>
          <stop offset="100%" stop-color="#E2E8F0"/>
        </linearGradient>
      </defs>
    </svg>
  </div>

  <!-- انتخاب زبان -->
  <div class="lang-selector" id="langSelector"></div>

  <!-- کادر ورود -->
  <div class="auth-container">
    <div class="chat-messages" id="onboardingChat">
      <div class="msg bot" id="initialGreeting">سلام! من دستیار هوش مصنوعی KAR AI هستم. لطفاً برای ساخت حساب، نام خود را وارد کنید.</div>
    </div>
    
    <div class="auth-form">
      <div class="input-group">
        <input type="text" id="onboardingInput" placeholder="نام و نام خانوادگی شما...">
      </div>
      <button class="btn-primary" id="onboardingSend">مرحله بعد ←</button>
    </div>
  </div>

  <div class="auth-links">
    <button class="auth-link" id="btnGuest">ورود به عنوان مهمان</button>
    <button class="auth-link" onclick="alert('در نسخه نهایی به صفحه ورود با رمز متصل می‌شود.')">ورود با رمز عبور</button>
  </div>

</div>

<!-- ================= داشبورد اصلی ================= -->
<div id="mainScreen">
  <header>
    <div class="logo">KAR <span>AI</span></div>
    <div id="userLabel">مهمان</div>
  </header>

  <div class="main-robot">
    <!-- ربات کوچک شده برای داشبورد -->
    <svg class="robot-svg" style="width: 90px; height: 90px;" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
       <ellipse cx="100" cy="165" rx="60" ry="15" fill="rgba(212, 175, 55, 0.1)" />
       <ellipse cx="100" cy="160" rx="40" ry="8" fill="rgba(212, 175, 55, 0.2)" />
       <rect x="55" y="40" width="90" height="100" rx="45" fill="url(#gradHousing)" stroke="rgba(212, 175, 55, 0.4)" stroke-width="2"/>
       <rect x="65" y="60" width="70" height="55" rx="27.5" fill="#111111" />
       <g class="eye-glow">
         <path d="M 80 85 Q 80 75 90 75 Q 100 75 100 85 Q 100 95 90 95 Q 80 95 80 85 Z" fill="#00E5FF" />
         <path d="M 100 85 Q 100 75 110 75 Q 120 75 120 85 Q 120 95 110 95 Q 100 95 100 85 Z" fill="#00E5FF" />
         <circle cx="85" cy="80" r="3" fill="#FFFFFF" opacity="0.8"/>
         <circle cx="105" cy="80" r="3" fill="#FFFFFF" opacity="0.8"/>
       </g>
       <circle cx="100" cy="130" r="3" fill="#D4AF37" opacity="0.6"/>
    </svg>
  </div>

  <!-- نوار افقی مهم -->
  <div class="featured-strip-wrapper">
    <div class="featured-strip" id="featuredStrip"></div>
  </div>

  <!-- گرید 12 آیکون 3D -->
  <div class="branches-grid" id="branchGrid"></div>

  <button class="fab-chat" id="fabChat">◈</button>
</div>

<!-- مودال چت داشبورد -->
<div class="modal-backdrop" id="chatModal">
  <div class="chat-box-dash">
    <div class="modal-header" style="padding:20px; border-bottom:1px solid var(--border-color); background:#fff;">
      <span class="modal-title" style="font-size: 18px; color: var(--gold-2);">✨ سوال بپرس...</span>
      <button class="close-btn" id="closeChatModal">×</button>
    </div>
    <div class="chat-messages" id="dashChatMessages">
      <div class="msg bot">سلام! چه خدمتی نیاز دارید؟ من می‌توانم راهنمایی‌تان کنم.</div>
    </div>
    <div class="chat-input-area">
      <input type="text" id="dashChatInput" placeholder="اینجا بنویسید...">
      <button id="dashChatSend">↑</button>
    </div>
  </div>
</div>

<!-- مودال فرم دستی -->
<div class="modal-backdrop" id="formModal">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title" id="formTitle">فرم درخواست</h2>
      <button class="close-btn" id="closeFormModal">×</button>
    </div>
    <div class="form-content" id="formContent"></div>
  </div>
</div>
<script>
"use strict";

/* =========================================
   KAR AI V9.0 (PRO UI) — PART 2: DATA
   Central Assistant + 12 Branches (68 Forms)
========================================= */

const CENTRAL_ASSISTANT = {
  id: "central",
  name: "دستیار KAR AI",
  avatar: "◈",
  greeting: "سلام! من دستیار هوش مصنوعی KAR AI هستم. می‌توانم در انتخاب شاخه مناسب، نحوه ثبت درخواست، کیف پول و همکاری به‌عنوان همکار راهنمایی‌تان کنم. چه کمکی می‌توانم بکنم؟",
  systemPrompt: `تو دستیار مرکزی هوش مصنوعی پلتفرم KAR AI هستی.
پلتفرم KAR AI یک اکوسیستم جامع خدمات هوشمند با ۱۲ شاخه تخصصی است. یک حساب کاربری و یک کیف پول مشترک دارد.
شاخه‌ها: کشاورزی، حمل‌ونقل، ساختمان، آموزش، سلامت، آگهی، حسابداری، مشاوره قضایی، گردشگری، پرداخت، مکانیک و تولید.
وظایف تو: راهنمایی کاربر برای انتخاب شاخه، توضیح نحوه ثبت درخواست، هدایت به دستیار تخصصی شاخه.
محدودیت‌ها: هرگز قیمت دقیق اعلام نکن، ادعای انجام خدمت نکن، اطلاعات شخصی درخواست نکن.`,
  suggestions: [
    { label: "چطور درخواست ثبت کنم؟", answer: "برای ثبت درخواست ۳ گام ساده: ۱) شاخه موردنظر را انتخاب کنید. ۲) دسته خدمت را انتخاب کنید تا فرم باز شود. ۳) فرم را پر کنید و ثبت کنید." },
    { label: "چه شاخه‌ای مناسب من است؟", answer: "بستگی به نیاز شما دارد. ما ۱۲ شاخه داریم: کشاورزی، حمل‌ونقل، ساختمان، آموزش، سلامت، آگهی، حسابداری، حقوقی، گردشگری، بانک، مکانیک و تولید. اگر بگویید دنبال چه هستید، دقیق‌تر راهنمایی می‌کنم." },
    { label: "کیف پول چطور کار می‌کند؟", answer: "KAR AI یک کیف پول مشترک بین همه شاخه‌ها دارد. شارژ از درگاه مجاز، بدون تاریخ انقضا، و قابل انتقال بین کاربران است." },
    { label: "چطور همکار شوم؟", answer: "از دکمه «همکاری با ما» در هدر درخواست دهید. تیم KAR AI پس از بررسی، مدارک را تأیید و پروفایل شما را فعال می‌کند." }
  ]
};

const BRANCHES_DATA = {
  iran_keshavarz: {
    slug: "iran_keshavarz", title: "ایران کشاورز", icon: "🚜",
    shortDescription: "خدمات و راهکارهای تخصصی کشاورزی",
    description: "از سم‌پاشی و خدمات پهپادی گرفته تا اجاره ماشین‌آلات، تأمین نهاده، آبیاری و مشاوره مزرعه.",
    categories: ["سم‌پاشی و محلول‌پاشی", "خدمات پهپادی", "ماشین‌آلات و ادوات", "اجاره تجهیزات", "نهاده و بذر", "آبیاری", "مشاوره مزرعه", "خرید و فروش محصول"],
    formsByCategoryIndex: {

<script>
"use strict";

/* =========================================
   KAR AI V9.0 (PRO UI) — PART 3 (AI LOGIC)
========================================= */

// ---------------- 1. STATE & CONFIG ----------------
const appState = {
  lang: "fa", // fa, ar, az, ku, en
  isMuted: false,
  user: { name: "مهمان", isGuest: true },
  onboardingStep: 0, // 0: Start, 1: Name, 2: Last, 3: Mobile, 4: Done
  chatMode: "idle", 
  currentBranch: null,
  currentCategory: null,
  currentForm: null
};

const LANGUAGES = {
  fa: { code: "fa-IR", label: "فارسی", hello: "سلام! من دستیار هوش مصنوعی KAR AI هستم. اسم کوچیکت چیه تا حسابت رو بسازیم؟" },
  ar: { code: "ar-SA", label: "العربية", hello: "مرحباً! أنا مساعد الذكاء الاصطناعي KAR AI. ما هو اسمك الأول؟" },
  az: { code: "az-AZ", label: "آذری", hello: "Salam! Mən KAR AI süni intellekt köməkçisiyəm. Adınız nədir?" },
  ku: { code: "ku-TR", label: "کوردی", hello: "سڵاو! من یاریدەدەری زیرەکی دەستکردی KAR AI یەم. ناوی یەکەمت چییە؟" },
  en: { code: "en-US", label: "English", hello: "Hello! I am the KAR AI assistant. What is your first name?" }
};

// تبدیل اعداد فارسی به انگلیسی برای تشخیص درست هوش مصنوعی
function normalizeDigits(str) {
  if (typeof str !== "string") return "";
  return str
    .replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d))
    .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
}

// ---------------- 2. VOICE ENGINE (STT & TTS) ----------------
const synth = window.speechSynthesis;
let recognition = null;
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
}

function speak(text) {
  if (appState.isMuted || !synth) return;
  synth.cancel(); // قطع صدای قبلی
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = LANGUAGES[appState.lang].code;
  utterance.rate = 1.0;
  synth.speak(utterance);
}

// دکمه میکروفون را به صورت داینامیک به کادرهای ورود اضافه می‌کنیم
function injectMicButtons() {
  const style = document.createElement('style');
  style.innerHTML = `.mic-btn { background: #F8F9FA; border: 1px solid var(--border-color); color: var(--text-muted); width: 46px; height: 46px; border-radius: 12px; font-size: 18px; display: grid; place-items: center; transition: 0.3s; cursor: pointer; } .mic-btn.recording { background: #ff5252; color: white; border-color: #ff5252; animation: pulse 1.5s infinite; } @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,82,82,0.5); } 70% { box-shadow: 0 0 0 10px rgba(255,82,82,0); } 100% { box-shadow: 0 0 0 0 rgba(255,82,82,0); } }`;
  document.head.appendChild(style);

  // دکمه میکروفون برای ثبت‌نام
  const onbForm = document.querySelector('.auth-form .input-group');
  if (onbForm && !document.getElementById('micBtnOnb')) {
    const btn = document.createElement('button');
    btn.id = 'micBtnOnb'; btn.className = 'mic-btn'; btn.type = 'button'; btn.innerHTML = '🎤';
    btn.onclick = () => startListening('onboardingInput');
    onbForm.insertBefore(btn, onbForm.firstChild);
  }

  // دکمه میکروفون برای داشبورد
  const dashForm = document.querySelector('.chat-input-area');
  if (dashForm && !document.getElementById('micBtnDash')) {
    const btn = document.createElement('button');
    btn.id = 'micBtnDash'; btn.className = 'mic-btn'; btn.type = 'button'; btn.innerHTML = '🎤';
    btn.onclick = () => startListening('dashChatInput');
    dashForm.insertBefore(btn, dashForm.firstChild);
  }
}

function startListening(inputId) {
  if (!recognition) {
    alert("مرورگر شما از میکروفون پشتیبانی نمی‌کند. لطفاً از مرورگر Chrome استفاده کنید.");
    return;
  }
  recognition.lang = LANGUAGES[appState.lang].code;
  recognition.start();
  const micBtn = document.getElementById(inputId === "onboardingInput" ? "micBtnOnb" : "micBtnDash");
  if(micBtn) micBtn.classList.add("recording");
  
  recognition.onresult = function(event) {
    const transcript = event.results[0][0].transcript;
    document.getElementById(inputId).value = transcript;
    if(micBtn) micBtn.classList.remove("recording");
    // ارسال خودکار بعد از صحبت
    if(inputId === "onboardingInput") handleOnboardingInput();
    else if(inputId === "dashChatInput") handleDashboardChat();
  };

  recognition.onerror = function() { if(micBtn) micBtn.classList.remove("recording"); };
  recognition.onend = function() { if(micBtn) micBtn.classList.remove("recording"); };
}

// ---------------- 3. ONBOARDING (LOGIN) LOGIC ----------------
const onbChat = document.getElementById("onboardingChat");
const onbInput = document.getElementById("onboardingInput");

function renderLangSelector() {
  const wrapper = document.getElementById("langSelector");
  wrapper.innerHTML = "";
  Object.keys(LANGUAGES).forEach(key => {
    const btn = document.createElement("button");
    btn.className = `lang-btn ${appState.lang === key ? 'active' : ''}`;
    btn.textContent = LANGUAGES[key].label;
    btn.onclick = () => {
      appState.lang = key;
      renderLangSelector();
      // تغییر پیام خوش‌آمدگویی بر اساس زبان جدید
      document.getElementById("initialGreeting").textContent = LANGUAGES[key].hello;
      speak(LANGUAGES[key].hello);
    };
    wrapper.appendChild(btn);
  });
}

function startOnboarding() {
  injectMicButtons();
  renderLangSelector();
  appState.onboardingStep = 1;
  
  // سلام اولیه
  setTimeout(() => speak(LANGUAGES[appState.lang].hello), 1000);
}

function handleOnboardingInput() {
  const val = onbInput.value.trim();
  if (!val) return;
  
  addMsg(onbChat, val, "user");
  onbInput.value = "";

  setTimeout(() => {
    if (appState.onboardingStep === 1) {
      appState.user.name = val;
      const reply = `خوشبختم ${val} جان! فامیلیت چیه؟`;
      addMsg(onbChat, reply, "bot");
      speak(reply);
      appState.onboardingStep = 2;
    } else if (appState.onboardingStep === 2) {
      appState.user.last = val;
      const reply = `ممنون. شماره موبایلت رو وارد کن (مثلاً 09123456789).`;
      addMsg(onbChat, reply, "bot");
      speak(reply);
      appState.onboardingStep = 3;
    } else if (appState.onboardingStep === 3) {
      if (val.length < 10) {
        const reply = "شماره موبایل نامعتبره. دوباره وارد کن.";
        addMsg(onbChat, reply, "bot");
        speak(reply);
      } else {
        appState.user.mobile = val;
        const reply = "✅ ثبت‌نام شما با موفقیت انجام شد! در حال ورود به داشبورد...";
        addMsg(onbChat, reply, "bot");
        speak(reply);
        appState.onboardingStep = 4;
        appState.user.isGuest = false;
        setTimeout(goToMainScreen, 1500);
      }
    }
  }, 600);
}

document.getElementById("onboardingSend").addEventListener("click", handleOnboardingInput);
onbInput.addEventListener("keypress", (e) => { if(e.key === "Enter") handleOnboardingInput(); });

// ورود مهمان
document.getElementById("btnGuest").addEventListener("click", () => {
  appState.user.isGuest = true;
  appState.user.name = "مهمان";
  goToMainScreen();
});

// ---------------- 4. MAIN SCREEN (DASHBOARD) ----------------
function goToMainScreen() {
  document.getElementById("onboardingScreen").classList.add("hidden");
  document.getElementById("mainScreen").classList.add("active");
  document.getElementById("userLabel").textContent = appState.user.isGuest ? "مهمان" : appState.user.name + " عزیز";
  
  renderDashboard();
}

function renderDashboard() {
  // نوار افقی (Featured)
  const featured = ["iran_keshavarz", "iran_transport", "iran_legal", "iran_education"];
  const strip = document.getElementById("featuredStrip");
  strip.innerHTML = "";
  featured.forEach(key => {
    const d = BRANCHES_DATA[key];
    const div = document.createElement("div");
    div.className = "featured-item";
    div.innerHTML = `<div class="icon">${d.icon}</div><span>${d.title}</span>`;
    div.onclick = () => openBranchInChat(d.title);
    strip.appendChild(div);
  });

  // گرید ۱۲ آیکون
  const grid = document.getElementById("branchGrid");
  grid.innerHTML = "";
  Object.keys(BRANCHES_DATA).forEach(key => {
    const d = BRANCHES_DATA[key];
    const card = document.createElement("div");
    card.className = "branch-card";
    card.innerHTML = `<div class="icon-circle">${d.icon}</div><span>${d.title}</span>`;
    card.onclick = () => openBranchInChat(d.title);
    grid.appendChild(card);
  });
}

// ---------------- 5. HYBRID CHAT & AI ----------------
const dashChatModal = document.getElementById("chatModal");
const dashChatBox = document.getElementById("dashChatMessages");
const dashInput = document.getElementById("dashChatInput");

function addMsg(box, text, role) {
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

document.getElementById("fabChat").addEventListener("click", () => {
  dashChatModal.classList.add("show");
  dashInput.focus();
});
document.getElementById("closeChatModal").addEventListener("click", () => {
  dashChatModal.classList.remove("show");
});

// اگر کاربر روی کارت‌های شاخه کلیک کرد (دستی)
function openBranchInChat(branchTitle) {
  appState.currentBranch = null; 
  appState.currentCategory = null;
  appState.currentForm = null;
  
  dashChatModal.classList.add("show");
  addMsg(dashChatBox, `کاربر روی ${branchTitle} کلیک کرد.`, "user");
  
  setTimeout(() => {
    const key = Object.keys(BRANCHES_DATA).find(k => BRANCHES_DATA[k].title === branchTitle);
    appState.currentBranch = key;
    const data = BRANCHES_DATA[key];
    const reply = `عالیه! وارد بخش ${data.title} شدیم. چه کاری از این بخش می‌خوای انجام بدیم؟ (${data.categories.slice(0,3).join("، ")} و...)`;
    addMsg(dashChatBox, reply, "bot");
    speak(reply);
  }, 600);
}

// ارسال پیام در داشبورد
function handleDashboardChat() {
  const text = dashInput.value.trim();
  if (!text) return;
  addMsg(dashChatBox, text, "user");
  dashInput.value = "";
  
  setTimeout(() => {
    processAILogic(text);
  }, 800);
}

document.getElementById("dashChatSend").addEventListener("click", handleDashboardChat);
dashInput.addEventListener("keypress", (e) => { if(e.key === "Enter") handleDashboardChat(); });

// مغز هوش مصنوعی (شبیه‌ساز)
function processAILogic(text) {
  const cleanText = normalizeDigits(text);

  // ۱. تشخیص شاخه
  if (!appState.currentBranch) {
    let found = null;
    if (cleanText.includes("کشاورزی") || cleanText.includes("سم") || cleanText.includes("پهپاد")) found = "iran_keshavarz";
    else if (cleanText.includes("ماشین") || cleanText.includes("حمل") || cleanText.includes("بار")) found = "iran_transport";
    else if (cleanText.includes("خانه") || cleanText.includes("لوله") || cleanText.includes("برق")) found = "iran_building";
    
    if (found) {
      appState.currentBranch = found;
      const data = BRANCHES_DATA[found];
      const reply = `عالیه! وارد بخش ${data.title} شدیم. چه خدمتی می‌خوای؟ (${data.categories.join("، ")})`;
      addMsg(dashChatBox, reply, "bot");
      speak(reply);
    } else {
      const reply = "متوجه نشدم. لطفاً یکی از شاخه‌ها رو بگو (مثلاً کشاورزی، حمل‌ونقل) یا روی کارت‌های پایین کلیک کن.";
      addMsg(dashChatBox, reply, "bot");
      speak(reply);
    }
    return;
  }

  // ۲. تشخیص دسته
  if (appState.currentBranch && appState.currentCategory === null) {
    const data = BRANCHES_DATA[appState.currentBranch];
    let foundIdx = -1;
    data.categories.forEach((cat, i) => {
      if (cleanText.includes(cat) || cat.includes(cleanText)) foundIdx = i;
    });
    // کیووردهای خاص
    if (appState.currentBranch === "iran_keshavarz" && cleanText.includes("سم")) foundIdx = 0;
    if (appState.currentBranch === "iran_keshavarz" && cleanText.includes("پهپاد")) foundIdx = 1;

    if (foundIdx > -1) {
      appState.currentCategory = foundIdx;
      const reply = `انتخاب خوبی کردی! فرم «${data.categories[foundIdx]}» رو برات باز می‌کنم. اطلاعات رو بگو تا پر کنم...`;
      addMsg(dashChatBox, reply, "bot");
      speak(reply);
      renderForm(appState.currentBranch, foundIdx);
    } else {
      const reply = `دسته‌های موجود در این بخش: ${data.categories.join("، ")}. کدوم رو می‌خوای؟`;
      addMsg(dashChatBox, reply, "bot");
      speak(reply);
    }
    return;
  }

  // ۳. اگر فرم باز است، تلاش برای پر کردن فیلدها با حرف کاربر
  if (appState.currentForm) {
    const form = appState.currentForm;
    let filled = false;
    
    // جستجوی عدد برای فیلدهای Number
    const numMatch = cleanText.match(/\d+/);
    if (numMatch) {
      const numField = form.fields.find(f => f.type === "number" && document.getElementById(`field-${f.id}`) && !document.getElementById(`field-${f.id}`).value);
      if (numField) {
        document.getElementById(`field-${numField.id}`).value = numMatch[0];
        const reply = `عدد ${numMatch[0]} رو توی فیلد «${numField.label}» ثبت کردم.`;
        addMsg(dashChatBox, reply, "bot");
        speak(reply);
        filled = true;
      }
    }
    
    if (!filled) {
      const reply = "فرم برات بازه. می‌تونی خودت دستی پر کنی یا اگر فیلدی مونده بهم بگو تا پر کنم. در نهایت روی «ثبت نهایی» بزن.";
      addMsg(dashChatBox, reply, "bot");
      speak(reply);
    }
  }
}

// ---------------- 6. DYNAMIC FORM ENGINE ----------------
function renderForm(branchSlug, categoryIndex) {
  const data = BRANCHES_DATA[branchSlug];
  const form = data.formsByCategoryIndex[categoryIndex];
  if (!form) return;

  appState.currentBranch = branchSlug;
  appState.currentCategory = categoryIndex;
  appState.currentForm = form;

  document.getElementById("formTitle").textContent = form.title;
  const content = document.getElementById("formContent");
  
  content.innerHTML = `
    <p style="font-size:13px; color:var(--text-muted); margin-bottom:20px;">${form.intro}</p>
    <form id="dynamicForm">
      ${form.fields.map(f => `
        <div class="field">
          <label>${f.label} ${f.required ? '<span style="color:red">*</span>' : ''}</label>
          ${f.type === "select" 
            ? `<select id="field-${f.id}" ${f.required ? "required" : ""}><option value="">انتخاب کنید</option>${f.options.map(o => `<option value="${o}">${o}</option>`).join("")}</select>`
            : f.type === "textarea"
              ? `<textarea id="field-${f.id}" rows="3" ${f.required ? "required" : ""}></textarea>`
              : `<input id="field-${f.id}" type="${f.type}" ${f.required ? "required" : ""} min="${f.min || ""}" max="${f.max || ""}">`
          }
        </div>
      `).join("")}
      <button type="submit" class="btn-submit">ثبت نهایی درخواست</button>
    </form>
  `;

  document.getElementById("formModal").classList.add("show");
  dashChatModal.classList.remove("show"); // بستن چت تا کاربر فرم رو ببینه

  // ثبت فرم
  document.getElementById("dynamicForm").addEventListener("submit", (e) => {
    e.preventDefault();
    document.getElementById("formModal").classList.remove("show");
    
    // باز کردن مجدد چت و پیام موفقیت
    dashChatModal.classList.add("show");
    const reply = "✅ درخواست شما با موفقیت ثبت شد! کد پیگیری: KAR-" + Math.floor(Math.random()*90000+10000);
    addMsg(dashChatBox, reply, "bot");
    speak(reply);
    
    // ریست برای سفارش بعدی
    appState.currentBranch = null;
    appState.currentCategory = null;
    appState.currentForm = null;
  });
}

document.getElementById("closeFormModal").addEventListener("click", () => {
  document.getElementById("formModal").classList.remove("show");
  dashChatModal.classList.add("show");
  const reply = "فرم رو بستم. اگر خواستی دوباره پر کنیم بگو.";
  addMsg(dashChatBox, reply, "bot");
  speak(reply);
});
